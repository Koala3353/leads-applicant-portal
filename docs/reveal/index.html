<!doctype html>
<!--
  Eyes on LEADS: the results reveal, Act 2 "The file" (GitHub Pages, not Apps Script; clasp ignores docs/).
  Act 1 is docs/results/, the public page the acceptance email links to. It ends on the LEADS eye and sends them into
  the portal with ?reveal=1; the portal (Home.html) then opens this page full screen, once, for an ACCEPTED applicant,
  and says who it is with postMessage:
      { type: 'leads-reveal-init', id: 'APP-2306', nick: 'Bea', stamp: 'ACCEPTED', sound: true }
  so the page itself never states anyone's result (opened on its own it stamps REVIEWED and the card says nothing about
  a result). It answers with 'leads-reveal-ready' (fonts loaded, about to play), 'leads-reveal-replay' (started again,
  so the portal resets its safety timer) and 'leads-reveal-done' (closed from the end card).
  ~11 s in one 2D canvas. Nov 14 2026, photocopied per the brand book (xerox.js, shared with Act 1): a halftone print of
  a sheet on a desk (plates/desk.png) under a swinging lamp you only see as light, a printed manila cover that opens, the
  intake form printed onto the sheet, a black-and-white photo of an eye (the portal home page's .reye, painted) that
  opens and looks up, the one-frame scare, the mirror (their eye-scan photo), the form typing itself, ACCEPTED inked into
  the paper, then the Broadcast Card. No triangle eye.
  Sound is one pre-mixed file (audio/act2.mp3, or audio/act2_calm.mp3 for reduced motion). If it is missing the film is silent.
  ?at=4.6 freezes a frame (for review, no sound).
  Nov 13 2026: (1) it opens on a one-tap gate ("Open your file"), because a phone only plays sound after a tap on this
  page and the stamp's sound is the payoff; while the gate waits it sends 'leads-reveal-replay' every 30 s so the
  portal's 45 s safety timer never closes it. (2) Tall phone screens get a bigger, higher card. (3) The stamp is a
  moment: the camera pushes in on it, a harder shake, and a held beat before the card. (4) If the portal sends their
  eye-scan photo ({ type: 'leads-reveal-eye', src: 'data:image/...' }), the mirror shows it ("That one is you.").
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Eyes on LEADS // Transmission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Special+Elite&display=swap">
<link rel="modulepreload" href="ink.js?v=3">
<style>
  :root{--film-black:#070606;--oxblood:#3a0806;--dried-red:#7a120c;--chalk:#e6e0d4;--cctv:#8b97a4;--misreg-blue:#2b4a86;--lamp-warm:#d8b787;--brand-red:#e50000;--card-blue:#000ff0;--yellow:#fffc04}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--film-black);color:var(--chalk);overflow:hidden;font-family:'JetBrains Mono',ui-monospace,monospace}
  #film{position:fixed;inset:0;width:100%;height:100%;display:block}
  /* captions: bottom centre, above the controls */
  #cap{position:fixed;z-index:3;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 64px);transform:translateX(-50%);width:max-content;max-width:80vw;margin:0;
    text-align:center;pointer-events:none;font:700 clamp(16px,3.4vw,26px)/1.3 'JetBrains Mono',monospace;color:var(--chalk);text-shadow:0 0 6px var(--film-black),0 1px 0 var(--film-black)}
  #cap:not(:empty){padding:.2em .5em;background:rgba(7,6,6,.55)}
  #cap .cur{display:inline-block;width:1px;height:1em;background:currentColor;vertical-align:-.12em;margin-left:2px;box-shadow:0 0 0 .5px currentColor}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ctl{position:fixed;z-index:5;bottom:max(14px,env(safe-area-inset-bottom));right:14px;display:flex;gap:8px;transition:opacity .3s}
  .ctl.gone{opacity:0;pointer-events:none}
  button{font:700 13px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
    min-height:44px;padding:0 16px;border:0;color:#000;background:#c0c0c0;
    box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf,3px 3px 0 #000}
  button:active{box-shadow:inset 1px 1px #0a0a0a,inset -1px -1px #fff,inset 2px 2px #808080}
  button:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
  .snd-ic{vertical-align:-2px;margin-right:4px}
  /* the last frame: a Broadcast Card with the way out. It cuts in (no fade) unless motion is reduced */
  .end{position:fixed;inset:0;z-index:4;display:grid;place-items:end center;padding:20px 16px max(24px,env(safe-area-inset-bottom));opacity:0;pointer-events:none}
  .end.on{opacity:1;pointer-events:auto}
  .end[inert]{pointer-events:none}
  .card{width:min(560px,100%);background:var(--card-blue);color:#fff;text-align:center;padding:24px 20px 22px;rotate:-1deg;
    box-shadow:0 0 0 4px #000,0 0 0 7px var(--card-blue),8px 10px 0 7px #000}
  .card p{margin:0}
  .card .k{font:700 12px/1.4 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--yellow)}
  .card .t{font:800 clamp(32px,9vw,58px)/.95 'JetBrains Mono',monospace;letter-spacing:-.04em;text-transform:uppercase;margin:10px 0 12px}
  .card .s{font:400 15px/1.5 'JetBrains Mono',monospace}
  .card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .card .go{background:var(--yellow)}
  @media (prefers-reduced-motion:reduce){.end{transition:opacity .3s ease}}
  /* the gate: one tap opens the file (and lets the sound play) */
  .gate{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:24px 18px;text-align:center;background:rgba(7,6,6,.86)}
  .gate[hidden]{display:none}
  .gate h1{margin:0 0 12px;font:400 clamp(2rem,9vw,3.6rem)/1 'Special Elite','Courier New',monospace;color:var(--chalk);text-shadow:-2px 0 var(--dried-red),2px 0 var(--misreg-blue)}
  .gate p{margin:0 auto 24px;max-width:30ch;font:400 15px/1.55 'JetBrains Mono',monospace}
  .gate .go{background:var(--yellow);min-height:54px;width:min(320px,100%);font-size:15px}
  .gate .rec{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;font:700 13px/1 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--chalk)}
  .gate .rec i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand-red);margin-right:6px;vertical-align:0;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.gate .rec i{animation:none}}
</style>
</head>
<body>
<canvas id="film" aria-hidden="true"></canvas>
<p id="cap" aria-hidden="true"></p>
<p class="sr" id="capLive" role="status" aria-live="polite"></p>
<div class="ctl" id="ctl">
  <button type="button" id="sound" aria-pressed="false"></button>
  <button type="button" id="skip">Skip ▸▸</button>
</div>
<section class="gate" id="gate" aria-labelledby="gateT" hidden>
  <p class="rec" aria-hidden="true"><i></i>REC &nbsp;CAM 3</p>
  <div>
    <h1 id="gateT">Your file is ready.</h1>
    <p>It runs ten seconds. Turn your sound on.</p>
    <button type="button" class="go" id="gateGo">Open your file</button>
  </div>
</section>
<div class="end" id="end" role="dialog" aria-modal="true" aria-labelledby="endT" aria-describedby="endS" inert>
  <div class="card">
    <p class="k" id="endK">EYES ON LEADS &nbsp;·&nbsp; FINDING</p>
    <p class="t" id="endT">Your file.</p>
    <p class="s" id="endS">The rest of your file is inside. Come read it.</p>
    <p class="k" id="endD" style="margin-top:12px" hidden></p>
    <div class="row"><button type="button" class="go" id="open">Open your file</button><button type="button" id="replay">Replay</button></div>
  </div>
</div>

<script type="module">
import { PAL, reduced, boilFrame, span, lerp, mix, rgba, stage, wline, wtext, circ, partyEye, layer, grade, grain, vhs, misreg, shake,
  lampCone, stamp, drawStamp, glitch, filmAudio, SPEAKER, captions, fontsReady } from './ink.js?v=3';
import { plate, ready, monitor, vignette, reye, grayPhoto, drawPhoto, brush, manilaCard, affine } from './xerox.js?v=1';
const DESK = plate('plates/desk.png');   // halftone print of a sheet on a desk (see plates/CREDITS.md)
const SHEET = [[86, 609], [746, 405], [380, 1553]];   // the sheet's top-left, top-right, bottom-left corners on that plate

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const embedded = window.parent !== window;
const FREEZE = parseFloat(params.get('at'));
const frozen = !isNaN(FREEZE);
const PORTAL = 'https://script.google.com/a/macros/student.ateneo.edu/s/AKfycbwoL5I-i10w25U-nNqAlwfVEDF0NuQhWEHZq_EqMu9t3pszFNH72FuXhYXAH1TH2Fk/exec';

/* ============================== who is watching (from the portal) ============================== */
const who = { id: '', nick: '', stamp: 'REVIEWED', campDays: 0 };
const clean = (v, n) => String(v || '').replace(/[^\w .'ñÑ-]/g, '').trim().slice(0, n);
const num = () => who.id.replace(/^APP-/, '');
const subjectName = () => who.nick || (who.id ? 'No. ' + num() : 'you');   // their first name; the file number if the portal has none
let gotInit = null;
const initArrived = new Promise(r => { gotInit = r; });
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type !== 'leads-reveal-init') return;
  // only the portal (Apps Script serves it from *.googleusercontent.com) may say who this is, so nobody can frame
  // this page elsewhere and fake an acceptance
  const local = location.hostname === 'localhost' && e.origin === location.origin;   // for testing on this machine only
  if (!local && !/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
  who.id = clean(d.id, 12).toUpperCase(); who.nick = clean(d.nick, 18);
  who.stamp = d.stamp === 'ACCEPTED' ? 'ACCEPTED' : 'REVIEWED';   // only two words are ever drawn
  const camp = new Date(String(d.camp || '')); who.campDays = isNaN(camp) ? 0 : Math.ceil((camp.getTime() - Date.now()) / 864e5);
  paintIdentity(); makeStamp();
  if (d.sound) trySound();
  gotInit();
});
// (4) their own eye-scan photo for the mirror, sent by the portal after init (it can arrive a moment later)
let eyeImg = null;
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type !== 'leads-reveal-eye' || !/^data:image\/(png|jpe?g|webp|gif);base64,/.test(String(d.src || ''))) return;
  const local = location.hostname === 'localhost' && e.origin === location.origin;
  if (!local && !/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
  const img = new Image(); img.onload = () => { eyeImg = img; }; img.src = d.src;
});
const tell = (type, extra) => { if (embedded) try { parent.postMessage(Object.assign({ type }, extra || {}), '*'); } catch (e) { /* fine */ } };
function paintIdentity() {
  // the card says "You're in." only when the portal said ACCEPTED; opened alone it never states a result
  $('endT').textContent = who.stamp === 'ACCEPTED' ? "You're in" + (who.nick ? ', ' + who.nick + '.' : '.') : 'Your file.';
  $('endK').textContent = 'EYES ON LEADS  ·  ' + (who.id ? 'SUBJECT ' + num() : 'FINDING');
  // (6) accepted: how far away camp is (from the portal's camp date)
  const days = who.stamp === 'ACCEPTED' ? who.campDays : 0;
  $('endD').hidden = !(days > 0); if (days > 0) $('endD').textContent = days + (days === 1 ? ' day' : ' days') + ' until Kasile Hills';
}

/* ============================== sound, captions ============================== */
const END = 11.0, CARD = 9.6, CARD_LIVE = 9.6 + 2 / 30, CARD_BTN = 10.0;   // (3) a held beat on the stamp before the card
let t0 = 0, playing = false, focused = false;
const A = filmAudio(reduced ? 'audio/act2_calm.mp3' : 'audio/act2.mp3', () => playing && !frozen ? (performance.now() - t0) / 1000 : null);
const paintSound = () => { const on = A.on(); $('sound').innerHTML = SPEAKER(on) + (on ? ' Sound ON' : ' Sound OFF'); $('sound').setAttribute('aria-pressed', String(on)); $('sound').setAttribute('aria-label', on ? 'Sound on. Tap to mute' : 'Sound off. Tap to turn on'); };
paintSound();
$('sound').addEventListener('click', () => { A.toggle(); paintSound(); });
// the portal's sound is on, so start with sound: the tap that opened the portal lets an embedded page play in most
// browsers; where it doesn't (Safari), the button simply stays at Sound OFF
function trySound() { A.set(true); paintSound(); setTimeout(() => { if (!A.running()) { A.set(false); paintSound(); } }, 500); }
const cap = captions($('cap'), $('capLive'));
const CAPS = [[.5, 'One file left on the desk.', 26, 2.8], [5.7, 'That one is you.', 22, 7.2]];   // start, line, cps, clear
const live = () => [[.5, CAPS[0][1]], [3.2, 'The photo in the file looks up.'], [5.4, 'The photo is a mirror now.'], [5.7, CAPS[1][1]], [8.3, 'Stamped: ' + who.stamp.toLowerCase() + '.']];

/* ============================== the stamp, inked once (worn ink needs its own canvas) ============================== */
let stampCv = null;
function makeStamp() { stampCv = stamp(who.stamp, who.stamp === 'ACCEPTED' ? PAL.brand : PAL.red); }   // bright red only for ACCEPTED

/* ============================== the film ==============================
   0.0  fade up on a desk under a swinging lamp; 0.5 "One file left on the desk."
   1.7  the folder opens (form page, photo corner with a shut eye); 3.2 the photo eye opens and looks at you
   4.0  lamp dips; 4.3 it cuts out; 4.6 ONE frame of a huge eye (skipped for reduced motion); 5.1 the lamp flickers back
   5.3 the photo is a mirror; 5.7 "That one is you."; 6.0 the light warms and the camera pulls back
   6.9 the intake form types itself; 8.3 the stamp; 9.0 the Broadcast Card cuts in (buttons live at 9.4); 10.4 the film ends */
const st = stage($('film'));
const { ctx } = st;
let Ly = null;   // layout, set on fit

function lay() {
  const { W, H, u } = st;
  const tall = H > W * 1.5;   // a phone held upright: the sheet uses most of the width
  const pw = tall ? W * .8 : Math.min(W * .4, H * .64 / 1.414), ph = pw * 1.414, px = (W - pw) / 2, py = H * .52 - ph / 2;
  const fw = pw * 1.05, fh = ph * 1.03, x0 = px - pw * .025, y0 = py - ph * .015;
  Ly = { tall, fw, fh, fy: py + ph / 2, x0, y0, px, py, pw, ph, phW: pw * .3, phH: pw * .34, phX: px + pw * .64, phY: py + ph * .19,
         sx: px + pw * .58, sy: py + ph * .74, Lc: H * .2, sw: Math.max(22, Math.min(60, u * .075)), deskY: H * .9 };
}

/* the lamp swings like a pendulum, then settles (it never swings for reduced motion) */
const swing = t => reduced ? 0 : 14 * Math.cos(2 * Math.PI * t / 2.4) * Math.exp(-t / 6) * (1 - span(t, 6, 6.8)) * Math.PI / 180;
function lampI(t) {   // how bright the lamp is, 0..1
  if (reduced) return t < 4.3 ? 1 : t < 5.1 ? 0 : span(t, 5.1, 5.6);   // it goes out 4.3-5.1 and fades back, no flicker
  if (t < .3) return span(t, 0, .3);
  if (t >= 4 && t < 4 + 2 / 30) return .4;       // warning dip, 2 frames
  if (t >= 4.3 && t < 5.1) return 0;             // out
  if (t >= 5.1 && t < 5.17) return 1;            // flickers back: on 5.10, off 5.17, on 5.27, off 5.30, on 5.40
  if (t >= 5.17 && t < 5.27) return 0;
  if (t >= 5.27 && t < 5.3) return 1;
  if (t >= 5.3 && t < 5.4) return 0;
  return 1;
}
const typed = (t, str, ts, step) => reduced ? (t >= ts ? str : '') : t < ts ? '' : str.slice(0, Math.min(str.length, Math.floor((t - ts) / step + 1e-6) + 1));
const mirrorOn = t => t >= (reduced ? 4.7 : 5.3);

/* camera: push-in on the photo (2.6-3.4), pull back to read the page (6.0-6.8). Maps what is at the anchor to the target. */
function cam(t) {
  const { W, H } = st, { phX, phY, phW, phH, px, py, pw, ph, sx, sy } = Ly, k1 = span(t, 2.6, 3.4), k2 = span(t, 6, 6.8);
  const k3 = reduced ? 0 : 1 - (1 - span(t, 8.3, 9.1)) ** 3;   // after the stamp lands, ease in on it
  const a0 = [lerp(lerp(W / 2, phX + phW / 2, k1), px + pw / 2, k2), lerp(lerp(H / 2, phY + phH / 2, k1), py + ph / 2, k2)];
  const g0 = [lerp(lerp(W / 2, W * .55, k1), W / 2, k2), lerp(lerp(H / 2, H * .42, k1), H * .5, k2)];
  const a = [lerp(a0[0], sx, k3), lerp(a0[1], sy, k3)], g = [lerp(g0[0], W / 2, k3), lerp(g0[1], H * .46, k3)];
  return { s: 1 + .6 * k1 - .6 * k2 + .22 * k3, a, g };
}

/* the desk: a photocopied sheet on wood under a lamp you never see, only its light, swinging */
function desk(t, b) {
  const { W, H } = st, { px, py, pw, ph } = Ly, th = swing(t), warm = span(t, 6, 6.8), c = cam(t);
  ctx.save(); ctx.translate(c.g[0], c.g[1]); ctx.scale(c.s, c.s); ctx.translate(-c.a[0], -c.a[1]);
  if (ready(DESK)) {   // the plate, placed so its sheet is exactly the form page
    ctx.save(); affine(ctx, SHEET[0], [SHEET[1][0] - SHEET[0][0], SHEET[1][1] - SHEET[0][1]], [SHEET[2][0] - SHEET[0][0], SHEET[2][1] - SHEET[0][1]], [px, py], [pw, 0], [0, ph]);
    ctx.drawImage(DESK, 0, 0); ctx.restore();
  }
  folder(t, b, warm);
  ctx.restore();
  // the light: a warm pool that swings with the lamp; everything outside it sinks into the dark
  const lx = W / 2 + Math.sin(th) * H * .55, ly = H * .4, R = Math.max(W, H) * .62;
  const g = ctx.createRadialGradient(lx, ly, R * .05, lx, ly, R);
  g.addColorStop(0, warm ? `rgba(255,${Math.round(238 - warm * 14)},${Math.round(212 - warm * 40)},1)` : 'rgba(255,246,228,1)');
  g.addColorStop(.55, 'rgba(150,130,104,1)'); g.addColorStop(1, 'rgba(18,14,10,1)');
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  vignette(ctx, 0, 0, W, H, .55);
}

/* a manila cover over the form, hinged on the left; it opens at 1.7 */
function folder(t, b, warm) {
  const { x0, y0, fw, fh } = Ly, e = 1 - (1 - Math.min(1, Math.max(0, (t - 1.7) / .5))) ** 2, phi = e * 2.6;
  if (phi > 0.01) page(t, b, warm);
  const cs = Math.cos(phi);
  if (Math.abs(cs) > .03) {
    ctx.save(); ctx.translate(x0, 0); ctx.scale(cs, 1); ctx.translate(-x0, 0);
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    ctx.drawImage(manilaCard(), x0, y0, fw, fh); ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#c8ad74'; ctx.beginPath(); ctx.moveTo(x0, y0 + 2); ctx.lineTo(x0 + fw * .03, y0 - fh * .05); ctx.lineTo(x0 + fw * .3, y0 - fh * .05); ctx.lineTo(x0 + fw * .34, y0 + 2); ctx.fill();   // tab
    if (phi > 1.57) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x0, y0, fw, fh); }   // the inside of the cover, in its own shadow
    else {
      ctx.fillStyle = 'rgba(20,14,6,.85)'; ctx.font = `${Math.round(fw * .05)}px "Special Elite", "Courier New", monospace`; ctx.fillText('SUBJECT FILE', x0 + fw * .1, y0 + fh * .2);
      ctx.fillText(who.id ? 'NO. ' + num() : 'NO. ----', x0 + fw * .1, y0 + fh * .27);
      brush(ctx, [[x0 + fw * .1, y0 + fh * .6], [x0 + fw * .55, y0 + fh * .6], [x0 + fw * .55, y0 + fh * .74], [x0 + fw * .1, y0 + fh * .74], [x0 + fw * .1, y0 + fh * .6]], Math.max(3, fw * .012), 43, '#e50000', .85, b);   // a red label box, by hand
    }
    ctx.restore();
  }
}

/* the intake form, printed onto the sheet (multiply): header, labels, typed values, the photo corner, the stamp */
function page(t, b, warm) {
  const { px, py, pw, ph } = Ly, ink = '#111', mono = `"JetBrains Mono", monospace`, type = `"Special Elite", "Courier New", monospace`;
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = ink; ctx.textAlign = 'left';
  ctx.font = `700 ${Math.round(pw * .036)}px ${mono}`; ctx.fillText('EYES ON LEADS · ' + (who.id ? 'FILE ' + num() : 'INTAKE'), px + pw * .07, py + ph * .07);
  ctx.textAlign = 'right'; ctx.fillText('FORM 01-A', px + pw * .93, py + ph * .07); ctx.textAlign = 'left';
  ctx.fillRect(px + pw * .07, py + ph * .085, pw * .86, Math.max(1.5, pw * .005));
  ctx.font = `${Math.round(pw * .085)}px ${type}`; ctx.fillText('INTAKE FORM', px + pw * .07, py + ph * .15);
  const rows = [['SUBJECT', typed(t, subjectName(), 6.9, .3 / subjectName().length), .5], ['LAST SEEN', typed(t, 'just now', 7.35, .08), .62], ['FINDING', '', .74]];
  rows.forEach(([label, val, k]) => {
    const y = py + ph * k;
    ctx.globalAlpha = .75; ctx.font = `700 ${Math.round(pw * .032)}px ${mono}`; ctx.fillText(label, px + pw * .07, y - pw * .055);
    ctx.fillRect(px + pw * .07, y + pw * .012, pw * .86, Math.max(1, pw * .003)); ctx.globalAlpha = 1;
    if (val) { ctx.font = `${Math.round(pw * .07)}px ${type}`; ctx.fillText(val, px + pw * .08, y); }
  });
  ctx.globalAlpha = .9; ctx.fillRect(px + pw * .07, py + ph * .84, pw * .5, pw * .04); ctx.fillRect(px + pw * .07, py + ph * .88, pw * .32, pw * .04);   // redacted notes
  ctx.globalAlpha = 1;
  if (t >= 8.03 && t < 8.3) ctx.fillRect(px + pw * .08, py + ph * .74 - pw * .06, pw * .03, pw * .065);   // a cursor waiting on FINDING
  ctx.restore();
  photo(t, b);
  // the stamp: its shadow first, then it lands, inked into the paper
  const { sx, sy } = Ly, sw = pw * .62, f = Math.floor((t - 8.3) * 30 + 1e-6);
  if (t >= 8.1 && t < 8.3) { const k = span(t, 8.1, 8.3); ctx.fillStyle = `rgba(0,0,0,${.3 * k})`; ctx.fillRect(sx - sw * .5 * k, sy - sw * .1 * k, sw * k, sw * .2 * k); }
  if (t >= 8.3 && stampCv) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; drawStamp(st, stampCv, sx, sy, sw * (!reduced && f === 0 ? 1.12 : !reduced && f === 1 ? 1.04 : 1), -6 * Math.PI / 180, 1); ctx.restore(); }
}

/* the photo corner: a black-and-white photo of an eye, shut; at 3.2 it opens and looks up at you. At 5.3 it is a mirror. */
function photo(t, b) {
  const { phX, phY, phW, phH } = Ly, cx = phX + phW / 2, cy = phY + phH / 2;
  ctx.save();
  ctx.fillStyle = '#f2efe6'; ctx.fillRect(phX - phW * .05, phY - phW * .05, phW * 1.1, phH * 1.1);   // the print's white border
  ctx.beginPath(); ctx.rect(phX, phY, phW, phH); ctx.clip();
  ctx.fillStyle = '#1b1b1b'; ctx.fillRect(phX, phY, phW, phH);
  const ge = mirrorOn(t) ? grayPhoto(eyeImg) : null;
  if (ge) drawPhoto(ctx, ge, phX, phY, phW, phH);   // the mirror is their own eye-scan photo
  else if (mirrorOn(t)) reye(ctx, cx, cy, phW * 2.1, { pupil: .34 });   // a mirror: an eye that is looking straight at you
  else reye(ctx, cx, cy, phW * 2.1, { open: .04 + .96 * span(t, 3.2, 3.3), px: 0, py: 1 - span(t, 3.2, 3.45), pupil: .3 });
  if (mirrorOn(t)) {   // mirror glare
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.moveTo(phX + phW * .1, phY); ctx.lineTo(phX + phW * .45, phY); ctx.lineTo(phX + phW * .9, phY + phH); ctx.lineTo(phX + phW * .55, phY + phH); ctx.fill();
  }
  ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = '#111';   // photo corners: small inked L brackets
  const l = phW * .13, w2 = Math.max(1.5, phW * .022), o2 = phW * .045;
  [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(([kx, ky]) => { const x = kx ? phX + phW + o2 : phX - o2, y = ky ? phY + phH + o2 : phY - o2, dx = kx ? -1 : 1, dy = ky ? -1 : 1;
    ctx.fillRect(dx > 0 ? x : x - l, dy > 0 ? y : y - w2, l, w2); ctx.fillRect(dx > 0 ? x : x - w2, dy > 0 ? y : y - l, w2, l); });
  ctx.restore();
}

/* the one frame of the film that is meant to hurt: the watching eye, enormous, staring out of the dark */
function scare(b) {
  const { W, H } = st, w = Math.max(W * 1.3, H * .9), h = w / 2.1;
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);
  reye(ctx, W / 2, H * .48, w, { pupil: .42 });
  const fade = (y0, y1, a0, a1) => { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, `rgba(5,5,5,${a0})`); g.addColorStop(1, `rgba(5,5,5,${a1})`); ctx.fillStyle = g; ctx.fillRect(0, y0, W, y1 - y0); };
  fade(H * .48 - h / 2 - 2, H * .48 - h * .22, 1, 0); fade(H * .48 + h * .22, H * .48 + h / 2 + 2, 0, 1);
  misreg(st, 6);
}

function frame(t) {
  const { W, H } = st, b = boilFrame(t), f = Math.floor(t * 30 + 1e-6), I = lampI(t);
  st.begin(PAL.black); layer.a = 1;
  const ts = Math.min(t, CARD - .001);   // from the card on, the stamped form is held (dimmed) behind it
  if (!reduced && f === 138) scare(b);   // 4.60, exactly one frame; the loop makes sure a late tick still shows it
  else if (!reduced && t >= CARD && t < CARD_LIVE) {   // VHS input switch: two frames of blue noise
    ctx.fillStyle = PAL.blue; ctx.fillRect(0, 0, W, H); grain(st, .8, f); glitch(st, .5, f);
  } else if (I > .001) {
    const sh = shake(t, 8.3, st.u * .014);   // (3) the stamp hits harder
    ctx.save(); ctx.translate(sh.x, sh.y); desk(ts, b); ctx.restore();
    if (I < 1) { ctx.fillStyle = `rgba(5,5,5,${1 - I})`; ctx.fillRect(0, 0, W, H); }   // the lamp's brightness
    grade(st, I > 0 ? lerp(.18, .05, span(t, 6, 6.8)) : 0);
  }
  const bh = Math.max(40, Math.min(70, H * .07));
  const band = reduced ? { y: H * .6, a: .15 } : t >= 4.6 && t < 5.4 ? { y: lerp(-bh, H, (t - 4.6) / .8), a: .5 } : { y: ((t / 6) % 1) * (H + bh) - bh, a: .2 };
  if (I > .001 || f === 138) vhs(st, { t, band }); else grain(st, .07, reduced ? 1 : f);   // lamp out: grain only
  if (t >= CARD) { ctx.save(); ctx.globalAlpha = (reduced ? span(t, CARD, CARD + .3) : 1) * .55; ctx.fillStyle = PAL.black; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

/* ============================== playback ============================== */
let prevT = 0, buzzed = false, skipped = false;
function showCard(t) {
  const on = t >= (reduced ? CARD : CARD_LIVE), ready = t >= CARD_BTN;
  $('end').classList.toggle('on', on); $('end').inert = !ready; $('ctl').classList.toggle('gone', on);
  if (ready && !focused) { focused = true; $('open').focus(); }
}
function captionsAt(t) {
  const c = CAPS.find(c => t >= c[0] && t < c[3]);
  if (c) cap.show(c[1], c[0], t, c[2]); else cap.clear();
  const ev = live().filter(e => t >= e[0]).pop();
  if (ev) cap.say(ev[1]);
}
function loop() {
  if (!playing) return;
  let t = frozen ? FREEZE : (performance.now() - t0) / 1000;
  if (!frozen && !reduced && prevT < 4.6 && t >= 4.6 + 1 / 30) t = 4.6;   // a slow tick must not jump over the one scare frame
  if (!frozen && !reduced && !buzzed && t >= 8.3) { buzzed = true; try { if (navigator.vibrate) navigator.vibrate([70, 50, 140]); } catch (e) { /* fine */ } }   // (7) the stamp, felt (Android)
  prevT = t;
  frame(Math.min(t, END)); captionsAt(t); showCard(t);
  if (t >= END && !frozen) { playing = false; A.fade(); if (!skipped) tell('leads-reveal-finished'); return; }   // (8) watched to the end
  requestAnimationFrame(loop);
}
function start() {
  focused = false; prevT = 0; buzzed = false; skipped = false; cap.reset(); $('end').classList.remove('on'); $('end').inert = true; $('ctl').classList.remove('gone');
  t0 = performance.now(); playing = true;
  if (!frozen) A.begin(A.on());   // after the clock starts, so the file begins at t = 0
  paintSound(); requestAnimationFrame(loop);
}
addEventListener('resize', () => { st.fit(); lay(); if (!playing) frame(END - .01); });

/* Skip jumps to the card (the result is on it); closing only ever happens from the card */
function skip() { if ((performance.now() - t0) / 1000 < CARD_BTN) { t0 = performance.now() - CARD_BTN * 1000; A.fade(); if (!skipped) { skipped = true; tell('leads-reveal-skip'); } } }
$('skip').addEventListener('click', skip);
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if ($('end').inert) skip(); else if (embedded) tell('leads-reveal-done', { closed: true }); });
$('open').addEventListener('click', () => {
  if (embedded) tell('leads-reveal-done', { open: true });
  else location.href = params.get('back') && /^https:\/\/script\.google\.com\//.test(params.get('back')) ? params.get('back') : PORTAL;
});
$('replay').addEventListener('click', () => { tell('leads-reveal-replay', { started: true }); start(); });

/* ============================== go ============================== */
paintIdentity(); makeStamp(); lay();
if (!frozen) A.load();   // fetch + decode now; the picture never waits for it
await fontsReady();
makeStamp();   // again, now in the real typewriter font
tell('leads-reveal-ready');
// the portal answers ready with who this is; give it a moment so the stamp and the card never show the wrong word
if (embedded) await Promise.race([initArrived, new Promise(r => setTimeout(r, 800))]);
// (1) one tap to open: it lets the sound play on phones (the stamp's sound is the payoff), and the eye photo has time
// to arrive. While the gate waits, keep the portal's safety timer from closing the film.
if (frozen) start();
else {
  frame(0); $('gate').hidden = false; $('ctl').classList.add('gone'); $('gateGo').focus();
  const keep = setInterval(() => tell('leads-reveal-replay'), 30000);
  $('gateGo').addEventListener('click', () => {
    clearInterval(keep); $('gate').hidden = true;
    A.set(true); tell('leads-reveal-replay'); start();
  }, { once: true });
}
</script>
