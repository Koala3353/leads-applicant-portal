<!-- Dashboard.html  PLACEHOLDER — the applicant dashboard shown INSIDE the hub (Home.html).
     Not a page of its own: Home pulls this file in right under the hero. Server code: DashboardApi.gs (dash_ functions).

     Contract with the hub (see CONTEXT.md, section 9.2):
     - Everything lives inside section#dash. CSS starts with #dash, ids start with dash-. No globals: one IIFE.
     - Listen for the hub's data: document 'hub:context' (event.detail = home_getContext() result),
       or read window.HUB if it already fired. 'hub:error' fires if the hub failed to load.
     - When you render the real dashboard for an applicant, add the class has-dash to the body element:
       the hub then hides its own status card + progress path so nothing shows twice.
     - Never edit hub elements. Never throw out of your listener. Show nothing to guests / non-applicants.
     - Never write a scriptlet tag in a comment (Apps Script runs them even here). -->
<style>
  #dash{display:none;margin:8px 0 6px}
  #dash.show{display:block}
  #dash .dash-note{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-style:dashed}
  #dash .dash-note p{margin:0;color:var(--muted);font-size:.92rem;min-width:0;overflow-wrap:anywhere}
  #dash code{font-family:var(--mono);font-size:.85em;color:var(--sky)}
</style>

<section id="dash" aria-label="Your dashboard">
  <div class="card dash-note">
    <span class="pill wait">being built</span>
    <p>Applicant dashboard goes here: <code>Dashboard.html</code> + <code>DashboardApi.gs</code>. Only admins see this note.</p>
  </div>
</section>

<script>
  (function () {
    const root = document.getElementById('dash');

    function onContext(ctx) {
      // Placeholder: only admins see the slot, so applicants never see an unfinished box.
      // The real dashboard: if (!ctx.applicant) return;  then load dash_get() and render.
      if (ctx && ctx.isAdmin) root.classList.add('show');
    }

    document.addEventListener('hub:context', function (e) {
      try { onContext(e.detail); } catch (err) { console.error('Dashboard:', err); }
    });
    if (window.HUB && window.HUB.type === 'context') {
      try { onContext(window.HUB.detail); } catch (err) { console.error('Dashboard:', err); }
    }
  })();
</script>
