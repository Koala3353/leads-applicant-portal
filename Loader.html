<!-- Loader.html  (shared page-transition overlay. NO scriptlet tags in this file: it's pulled in with include().)
     Every page puts the include line right after its opening body tag (see CONTEXT.md, sections 3.4 and 6.2).
     - Covers the page while it first loads, then fades out.
       Pages that fetch data first: add data-loader-wait to the body tag and call Loader.hide() when ready.
     - Shows again automatically when someone clicks a link to another portal page.
     - Loader.show('Uploading…') / Loader.hide() can also be used for slow actions. -->
<style>
  /* Transition = an old CRT. Leaving a page: the screen shuts from a bright centre line outward (240ms).
     Page ready: it collapses back to a line and blinks off (360ms), revealing the page.
     Only clip-path / opacity / transform animate. Reduced motion: a plain fade. */
  .ld{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
    background:radial-gradient(520px 380px at 50% 46%,color-mix(in srgb,var(--night-glow) 75%,transparent),transparent 72%),var(--night);
    clip-path:inset(50% 0 50% 0);visibility:hidden;
    transition:clip-path .36s cubic-bezier(.77,0,.175,1),visibility 0s linear .36s}
  .ld.on{clip-path:inset(0 0 0 0);visibility:visible;transition:clip-path .24s cubic-bezier(.23,1,.32,1),visibility 0s}
  /* the bright scan line at the centre, flashed on open and close */
  .ld-line{position:fixed;left:0;right:0;top:50%;height:2px;margin-top:-1px;z-index:10000;pointer-events:none;
    background:#fff;box-shadow:0 0 18px 4px rgba(122,134,255,.8);opacity:0;transform:scaleX(0)}
  .ld-line.flash{animation:ldLine .42s cubic-bezier(.23,1,.32,1)}
  @keyframes ldLine{0%{opacity:1;transform:scaleX(.15)}45%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}
  .ld-box{display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0;transform:scale(.96);transition:opacity .2s ease,transform .3s cubic-bezier(.23,1,.32,1)}
  .ld.on .ld-box{opacity:1;transform:none;transition-delay:.08s}
  /* CCTV readout under the message: elapsed time + an indeterminate tape */
  .ld-meta{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;color:var(--muted)}
  .ld-tape{width:120px;height:4px;border:1px solid var(--line);position:relative;overflow:hidden}
  .ld-tape::after{content:"";position:absolute;inset:0;width:40%;background:var(--glow);animation:ldTape 1s cubic-bezier(.77,0,.175,1) infinite}
  @keyframes ldTape{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  .ld svg{width:148px;height:148px;overflow:visible}
  .ld-msg{margin:0;min-height:1.4em;font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;padding:0 16px;
    transition:opacity .25s ease}
  .ld-msg.swap{opacity:0}

  /* the ring: a camera lens focusing */
  .ld-arc{transform-origin:66px 66px;animation:ld-spin 1.15s linear infinite}
  .ld-arc2{transform-origin:66px 66px;animation:ld-spin 1.9s linear infinite reverse;opacity:.6}
  /* the eye in the middle: looks around, blinks, never stops watching */
  .ld-look{animation:ld-look 3.4s steps(1) infinite}
  .ld-lid{transform-box:fill-box;transform-origin:center;animation:ld-blink 3.4s ease-in-out infinite}
  .ld-rec{animation:ld-pulse 1.2s steps(1) infinite}

  @keyframes ld-spin{to{transform:rotate(360deg)}}
  @keyframes ld-blink{0%,40%,48%,100%{transform:scaleY(1)}44%{transform:scaleY(.06)}}
  @keyframes ld-look{0%,22%{transform:translate(0,0)}23%,46%{transform:translate(-9px,-2px)}47%,70%{transform:translate(9px,1px)}71%,100%{transform:translate(0,3px)}}
  @keyframes ld-pulse{50%{opacity:0}}

  @media (prefers-reduced-motion:reduce){
    .ld-arc,.ld-arc2,.ld-look,.ld-lid,.ld-rec,.ld-tape::after{animation:none!important}
    .ld,.ld.on{clip-path:none;transition:opacity .2s ease,visibility 0s linear .2s}
    .ld{opacity:0}.ld.on{opacity:1;transition:opacity .15s ease,visibility 0s}
    .ld-line{display:none}
  }
</style>

<div class="ld on" id="ld" role="status" aria-live="polite" aria-busy="true">
  <div class="ld-box">
    <svg viewBox="0 0 132 132" aria-hidden="true" focusable="false">
      <!-- track + two arcs -->
      <circle cx="66" cy="66" r="52" fill="none" style="stroke:var(--line)" stroke-width="2"/>
      <circle class="ld-arc" cx="66" cy="66" r="52" fill="none" style="stroke:var(--glow)" stroke-width="3.5"
              stroke-linecap="butt" stroke-dasharray="70 257"/>
      <circle class="ld-arc2" cx="66" cy="66" r="44" fill="none" style="stroke:var(--sky)" stroke-width="1.5"
              stroke-linecap="round" stroke-dasharray="18 34 6 34"/>

      <!-- the eye -->
      <defs><clipPath id="ldEyeClip"><path d="M30 66 Q66 36 102 66 Q66 96 30 66 Z"/></clipPath></defs>
      <g class="ld-lid">
        <path d="M30 66 Q66 36 102 66 Q66 96 30 66 Z" style="fill:var(--text)"/>
        <g clip-path="url(#ldEyeClip)"><g class="ld-look">
          <circle cx="66" cy="66" r="15" fill="#1A1A1A"/>
          <circle cx="66" cy="66" r="15" fill="none" stroke="#3A3A3A" stroke-width="3" stroke-dasharray="2 1.6"/>
          <circle cx="66" cy="66" r="6.5" fill="#000"/>
          <circle cx="71" cy="61" r="2.6" fill="#FFF"/>
        </g></g>
        <path d="M30 66 Q66 36 102 66 Q66 96 30 66 Z" fill="none" style="stroke:var(--night)" stroke-width="2"/>
      </g>
      <circle class="ld-rec" cx="52" cy="112" r="2.4" style="fill:var(--danger)"/>
      <text x="58" y="114.5" font-family="monospace" font-size="7.5" font-weight="700" letter-spacing="1" style="fill:var(--text)">REC</text>
    </svg>
    <p class="ld-msg" id="ldMsg">Establishing connection…</p>
    <div class="ld-meta" aria-hidden="true"><span id="ldClock">REC 00:00</span><span class="ld-tape"></span></div>
  </div>
</div>
<div class="ld-line" id="ldLine" aria-hidden="true"></div>

<script>
  /** Page-transition overlay. Loader.show(msg?) / Loader.hide(). */
  window.Loader = (function () {
    const el = document.getElementById('ld');
    const msg = document.getElementById('ldMsg');
    const line = document.getElementById('ldLine');
    const clock = document.getElementById('ldClock');
    let started = Date.now(), clockTimer = null;
    function flash() { if (!line) return; line.classList.remove('flash'); void line.offsetWidth; line.classList.add('flash'); }
    function runClock() {
      clearInterval(clockTimer); started = Date.now();
      const pad = n => String(n).padStart(2, '0');
      const draw = () => { const s = Math.floor((Date.now() - started) / 1000); if (clock) clock.textContent = 'REC ' + pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
      draw(); clockTimer = setInterval(draw, 1000);
    }
    const LINES = ['Establishing connection…', 'Pulling your file…', 'Adjusting the camera…',
      'Stay where you are…', 'Almost there. Act natural…'];
    let timer = null, safety = null, fixed = false;

    function cycle() {
      let i = Math.floor(Math.random() * LINES.length);
      msg.textContent = LINES[i];
      clearInterval(timer);
      timer = setInterval(function () {
        if (fixed) return;
        msg.classList.add('swap');
        setTimeout(function () { i = (i + 1) % LINES.length; msg.textContent = LINES[i]; msg.classList.remove('swap'); }, 250);
      }, 1800);
    }
    function show(text) {
      fixed = !!text;
      if (text) msg.textContent = text; else cycle();
      if (!el.classList.contains('on')) flash();
      el.classList.add('on'); el.setAttribute('aria-busy', 'true');
      runClock();
      // never trap anyone behind the overlay (cancelled navigation, very slow network)
      clearTimeout(safety); safety = setTimeout(hide, 20000);
    }
    function hide() {
      if (el.classList.contains('on')) setTimeout(flash, 260);   // the line blinks as the screen finishes collapsing
      el.classList.remove('on'); el.setAttribute('aria-busy', 'false');
      clearInterval(timer); clearInterval(clockTimer); clearTimeout(safety);
    }

    // first load: covered until the page is ready
    cycle();
    runClock();
    safety = setTimeout(hide, 20000);
    window.addEventListener('DOMContentLoaded', function () {
      if (!document.body.hasAttribute('data-loader-wait')) setTimeout(hide, 250);
    });
    // coming back via the browser's back button from cache
    window.addEventListener('pageshow', function (e) { if (e.persisted) hide(); });

    // clicking a link to another portal page (…/exec?page=… or …/dev?page=…)
    document.addEventListener('click', function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a || a.getAttribute('aria-disabled') === 'true' || a.target === '_blank' || a.hasAttribute('download')) return;
      if (!/\/macros\/.*\/(exec|dev)(\?|$)/.test(a.href)) return;
      show();
    });

    return { show: show, hide: hide };
  })();
</script>
