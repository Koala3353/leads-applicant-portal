<!doctype html>
<!--
  Eyes on LEADS: the results reveal (GitHub Pages, not Apps Script; clasp ignores docs/).
  ~15 s, code-only three.js (no models or video files). The portal (Home.html) opens this full screen, once, for an
  ACCEPTED applicant after Settings › ResultsReleased, and sends who it is with postMessage:
      { type: 'leads-reveal-init', id: 'APP-2306', nick: 'Bea', stamp: 'ACCEPTED' }
  so the page itself never states anyone's result (opened on its own it says REVIEWED). It answers with
  'leads-reveal-ready' (playing) and 'leads-reveal-done' (finished, skipped or "Open your file").
  Brand: black / white / grey, CRT blue #000ff0, yellow #fffc04, red #e50000; JetBrains Mono titles. No triangle eye.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Eyes on LEADS // Transmission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700;800&display=swap">
<style>
  :root{--black:#050505;--white:#fefffe;--grey:#808080;--blue:#000ff0;--yellow:#fffc04;--red:#e50000;--manila:#d3bc86}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--black);color:var(--white);overflow:hidden;font-family:'JetBrains Mono',ui-monospace,monospace}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  /* CRT treatment on top of everything: scanlines, vignette, a little chromatic fringe on text */
  .crt{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),
      radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.65) 100%)}
  #static{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;image-rendering:pixelated;opacity:0;mix-blend-mode:screen}
  #flash{position:fixed;inset:0;z-index:6;pointer-events:none;background:#fff;opacity:0}
  .hud{position:fixed;z-index:7;font:700 clamp(11px,1.6vw,14px)/1.2 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;
    color:#fff;mix-blend-mode:difference;pointer-events:none}
  #rec{top:max(16px,env(safe-area-inset-top));left:16px}
  #rec b{color:#fff}#rec i{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--red);margin-right:.5em;vertical-align:-.05em;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #clock{top:max(16px,env(safe-area-inset-top));right:16px;font-variant-numeric:tabular-nums}
  #subject{top:calc(max(16px,env(safe-area-inset-top)) + 24px);left:16px;opacity:.85}
  #cap{position:fixed;z-index:7;left:50%;bottom:18%;transform:translateX(-50%);width:min(92vw,900px);text-align:center;pointer-events:none;
    font:800 clamp(18px,4.2vw,40px)/1.15 'JetBrains Mono',monospace;letter-spacing:-.02em;text-transform:uppercase;
    text-shadow:-2px 0 rgba(229,0,0,.6),2px 0 rgba(0,15,240,.75);min-height:2.4em}
  #cap.ink{color:var(--black);text-shadow:-1px 0 rgba(229,0,0,.45),1px 0 rgba(0,15,240,.45)}
  #cap.ink:not(:empty){width:auto;max-width:92vw;padding:.25em .6em;background:rgba(254,255,254,.92);box-shadow:4px 4px 0 var(--black)}
  #cap:not(.ink):not(:empty){background:rgba(5,5,5,.55);padding:.2em .5em;width:auto;max-width:92vw}
  #cap .cur{display:inline-block;width:.55em;height:.95em;background:currentColor;vertical-align:-.1em;margin-left:.1em;animation:blink .8s steps(1) infinite}
  .ctl{position:fixed;z-index:9;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;right:14px}
  .ctl button,.end a,.end button{font:700 13px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
    min-height:44px;padding:0 16px;border:0;color:#000;background:#c0c0c0;
    box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf,3px 3px 0 #000}
  .ctl button:active,.end a:active,.end button:active{box-shadow:inset 1px 1px #0a0a0a,inset -1px -1px #fff,inset 2px 2px #808080}
  .ctl button:focus-visible,.end a:focus-visible,.end button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
  /* the last frame: a Broadcast Card with the way out */
  .end{position:fixed;inset:0;z-index:8;display:grid;place-items:end center;padding:20px 20px max(78px,calc(env(safe-area-inset-bottom) + 70px));opacity:0;pointer-events:none;transition:opacity .5s ease}
  .end.on{opacity:1;pointer-events:auto}
  .card{width:min(560px,100%);background:var(--blue);color:#fff;text-align:center;padding:26px 22px 24px;rotate:-1deg;
    box-shadow:0 0 0 4px #000,0 0 0 7px var(--blue),0 0 70px rgba(0,15,240,.55)}
  .card p{margin:0}
  .card .k{font:700 13px/1.3 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--yellow)}
  .card .t{font:400 clamp(40px,11vw,76px)/.92 Anton,'Arial Narrow',sans-serif;text-transform:uppercase;margin:10px 0 12px}
  .card .s{font:400 15px/1.5 'JetBrains Mono',monospace}
  .card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .card .go{background:var(--yellow)}
  /* 2D version: no WebGL, or reduced motion */
  #flat{position:fixed;inset:0;z-index:3;display:none;place-items:center;padding:24px;text-align:center}
  #flat.on{display:grid}
  #flat .eye2d{width:min(70vw,420px);aspect-ratio:2.6;position:relative}
  #flat svg{width:100%;height:100%;overflow:visible}
  @media (prefers-reduced-motion:reduce){#rec i,#cap .cur{animation:none}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="static" width="160" height="90" aria-hidden="true"></canvas>
<div id="flat" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>
<div class="crt" aria-hidden="true"></div>
<p class="hud" id="rec"><i></i><b>REC</b> &nbsp;CAM 03</p>
<p class="hud" id="clock">--:--:--</p>
<p class="hud" id="subject">SUBJECT ----</p>
<p id="cap" role="status" aria-live="polite"></p>
<div class="ctl">
  <button type="button" id="sound" aria-pressed="false">Sound off</button>
  <button type="button" id="skip">Skip ▸▸</button>
</div>
<div class="end" id="end" role="dialog" aria-modal="true" aria-labelledby="endT">
  <div class="card">
    <p class="k" id="endK">Transmission ends</p>
    <p class="t" id="endT">Your file is ready</p>
    <p class="s" id="endS">Come and see what we found.</p>
    <div class="row"><button type="button" class="go" id="open">Open your file</button><button type="button" id="replay">Replay</button></div>
  </div>
</div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }</script>
<script type="module">
/* ============================== who is watching (from the portal) ============================== */
const params = new URLSearchParams(location.search);
const embedded = window.parent !== window;
const who = { id: '', nick: '', stamp: 'REVIEWED' };
const clean = (v, n) => String(v || '').replace(/[^\w .'ñÑ-]/g, '').slice(0, n);
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type !== 'leads-reveal-init') return;
  // only the portal (Apps Script serves it from *.googleusercontent.com) may say who this is, so nobody can frame
  // this page elsewhere and fake an acceptance
  if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
  who.id = clean(d.id, 12).toUpperCase(); who.nick = clean(d.nick, 24);
  who.stamp = d.stamp === 'ACCEPTED' ? 'ACCEPTED' : 'REVIEWED';   // only two words are ever drawn
  paintIdentity();
});
const tell = (type, extra) => { if (embedded) try { parent.postMessage(Object.assign({ type }, extra || {}), '*'); } catch (e) { /* fine */ } };

const $ = id => document.getElementById(id);
function paintIdentity() {
  $('subject').textContent = 'SUBJECT ' + (who.id || '----');
  if (typeof redrawFile === 'function') redrawFile();
  // brand book voice: short, second person, case-file words, the reveal saved for the last line, ending on an invitation
  const num = who.id ? who.id.replace('APP-', '') : '000';
  $('endK').textContent = 'Subject ' + num + ' // finding: ' + who.stamp.toLowerCase();
  $('endT').textContent = who.stamp === 'ACCEPTED' ? 'Welcome to LEADS' : 'Your file is ready';
  $('endS').textContent = who.stamp === 'ACCEPTED' ? 'Your file is ready. Come and see yourself.' : 'Come and see what we found.';
}

/* ============================== clock, captions ============================== */
const pad = n => String(n).padStart(2, '0');
setInterval(() => { const d = new Date(); $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }, 250);
let capText = '', capShown = -1, capInk = false;
function caption(text, t0, t, cps) {   // types text out from t0 at cps characters a second
  const n = Math.max(0, Math.min(text.length, Math.floor((t - t0) * (cps || 34))));
  if (text === capText && n === capShown) return;
  if (text === capText && n > capShown && n <= text.length && text[n - 1] !== ' ') typeTick();
  capText = text; capShown = n;
  $('cap').innerHTML = '';
  $('cap').append(document.createTextNode(text.slice(0, n)));
  if (n < text.length || Math.floor(t * 2) % 2) { const c = document.createElement('span'); c.className = 'cur'; $('cap').append(c); }
}
function captionClear() { if (capText !== '') { capText = ''; capShown = -1; $('cap').textContent = ''; } }

/* ============================== sound (only after a tap: browsers block autoplay audio) ============================== */
let ac = null, master = null, drone = null, hiss = null, soundIsOn = false;
// Small speakers can't play the 55 Hz hum this started with, so the bed is made of things they can play:
// tape hiss, a mains hum with harmonics, a faint CRT whine, plus typing ticks, static on every cut and a stamp thud.
function soundOn() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    drone = ac.createGain(); drone.gain.value = 0; drone.connect(master);
    const hum = ac.createBiquadFilter(); hum.type = 'lowpass'; hum.frequency.value = 1400; hum.connect(drone);
    [[120, 'sawtooth', .05], [180, 'triangle', .05], [240, 'sine', .04], [7800, 'sine', .004]].forEach(([f, type, g]) => {
      const o = ac.createOscillator(), v = ac.createGain(); o.type = type; o.frequency.value = f; v.gain.value = g;
      o.connect(v); v.connect(f > 5000 ? drone : hum); o.start();
    });
    const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = nb; src.loop = true;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500;
    hiss = ac.createGain(); hiss.gain.value = .03; src.connect(hp); hp.connect(hiss); hiss.connect(master); src.start();
  }
  soundIsOn = !soundIsOn;
  if (ac.state === 'suspended') ac.resume();   // Safari / some Chrome builds start it suspended even after a tap
  master.gain.setTargetAtTime(soundIsOn ? .8 : 0, ac.currentTime, .05);
  if (soundIsOn) drone.gain.setTargetAtTime(.7, ac.currentTime, .3);
  return soundIsOn;
}
const live = () => ac && soundIsOn;
window.__revealAudio = () => ac ? { state: ac.state, on: soundIsOn, master: +master.gain.value.toFixed(2), drone: +drone.gain.value.toFixed(2), hiss: +hiss.gain.value.toFixed(3), t: +ac.currentTime.toFixed(2) } : null;   // for checking it plays
function noiseBurst(len, vol) {
  if (!live()) return;
  const b = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = .4; g.gain.value = vol;
  s.buffer = b; s.connect(f); f.connect(g); g.connect(master); s.start();
}
let lastTick = 0;
function typeTick() {   // one key of a typewriter / terminal
  if (!live() || ac.currentTime - lastTick < .045) return;
  lastTick = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = 1600 + Math.random() * 500;
  g.gain.setValueAtTime(.07, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0005, ac.currentTime + .03);
  o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime + .035);
}
function thud() {
  if (!live()) return;
  const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle';
  o.frequency.setValueAtTime(220, ac.currentTime); o.frequency.exponentialRampToValueAtTime(70, ac.currentTime + .25);
  g.gain.setValueAtTime(1, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .4);
  o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime + .45);
  noiseBurst(.12, .9);   // the paper smack is what small speakers hear
}
$('sound').addEventListener('click', () => { const on = soundOn(); $('sound').textContent = on ? 'Sound on' : 'Sound off'; $('sound').setAttribute('aria-pressed', String(on)); noiseBurst(.15, .5); });

/* ============================== static overlay ============================== */
const st = $('static'), sx = st.getContext('2d'), simg = sx.createImageData(160, 90);
function paintStatic(level) {
  st.style.opacity = level.toFixed(3);
  if (level < .01) return;
  const d = simg.data;
  for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  sx.putImageData(simg, 0, 0);
}

/* ============================== timeline ==============================
   0.0  dead CRT, static, "subject" typed in
   3.0  the monitor wall: eyes on every screen; the camera pushes in on CAM 03
   7.0  hard cut to white: the LEADS eye opens, the iris looks at you, then turns into a mirror
  11.0  the case file: a manila folder, the stamp slams down
  14.2  the Broadcast Card (low on the screen, so the stamp stays in view): Open your file (stays until a tap) */
const DUR = 15, END_AT = 14.2;
const FREEZE = parseFloat(params.get('at'));
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const span = (t, a, b) => ease((t - a) / (b - a));
let t0 = 0, running = false, ended = false, cutFired = {};
function fireOnce(key, fn) { if (!cutFired[key]) { cutFired[key] = true; fn(); } }
function flash(v) { $('flash').style.transition = 'none'; $('flash').style.opacity = String(v); requestAnimationFrame(() => { $('flash').style.transition = 'opacity .45s ease-out'; $('flash').style.opacity = '0'; }); }

function finish(how) {
  if (ended) return; ended = true;
  captionClear(); paintStatic(0);
  $('end').classList.add('on'); $('open').focus();
  if (live()) { drone.gain.setTargetAtTime(.15, ac.currentTime, .4); hiss.gain.setTargetAtTime(.01, ac.currentTime, .4); }
  if (how === 'skip') tell('leads-reveal-done', { skipped: true });
}
$('skip').addEventListener('click', () => { if (embedded) { tell('leads-reveal-done', { skipped: true }); } else finish('skip'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('skip').click(); });
$('open').addEventListener('click', () => {
  if (embedded) tell('leads-reveal-done', { open: true });
  else location.href = params.get('back') && /^https:\/\/script\.google\.com\//.test(params.get('back')) ? params.get('back') : 'https://script.google.com/a/macros/student.ateneo.edu/s/AKfycbwoL5I-i10w25U-nNqAlwfVEDF0NuQhWEHZq_EqMu9t3pszFNH72FuXhYXAH1TH2Fk/exec';
});
$('replay').addEventListener('click', () => { $('end').classList.remove('on'); start(); });

/* ============================== 2D fallback (no WebGL, or reduced motion) ============================== */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function flatPlay() {
  const f = $('flat'); f.classList.add('on');
  const beats = [
    [0, '<p class="hud" style="position:static;font-size:16px">FEED 03 // SUBJECT ' + (who.id || '----') + '</p>'],
    [2.5, eyeSvg(false)], [5, eyeSvg(true)],
    [7.5, '<div class="card" style="background:var(--manila);color:#111;box-shadow:6px 6px 0 #000"><p class="k" style="color:#7a5a12">CASE FILE 26/27</p><p class="t" style="color:var(--red);border:6px solid var(--red);display:inline-block;padding:4px 14px;rotate:-6deg">' + who.stamp + '</p></div>']
  ];
  const caps = [[0, 'We have been watching.'], [2.5, 'I can see you.'], [5, 'Do you see yourself?'], [7.5, 'Finding: ' + who.stamp.toLowerCase() + '.']];
  const tStart = performance.now();
  (function step() {
    if (ended) return;
    const t = (performance.now() - tStart) / 1000;
    let html = ''; beats.forEach(b => { if (t >= b[0]) html = b[1]; });
    if (f.dataset.html !== html) { f.dataset.html = html; f.innerHTML = html; }
    let c = ''; caps.forEach(x => { if (t >= x[0]) c = x[1]; });
    c ? caption(c, caps.find(x => x[1] === c)[0], t, 60) : captionClear();
    if (t > 10) return finish();
    setTimeout(step, 100);
  })();
}
function eyeSvg(mirror) {
  return '<div class="eye2d"><svg viewBox="-170 -70 340 140" aria-hidden="true"><path d="M-160 0 Q0 -120 160 0 Q0 120 -160 0Z" fill="#fefffe" stroke="#050505" stroke-width="12"/>' +
    '<circle r="44" fill="' + (mirror ? '#cfd3d6' : '#e50000') + '"/><text x="0" y="22" text-anchor="middle" font-family="Anton" font-size="64" fill="#050505">A</text>' +
    '<text x="-72" y="22" text-anchor="middle" font-family="Anton" font-size="64" fill="#050505">LE</text><text x="78" y="22" text-anchor="middle" font-family="Anton" font-size="64" fill="#050505">DS</text></svg></div>';
}

/* ============================== three.js ============================== */
let THREE = null, renderer = null;
try {
  const probe = document.createElement('canvas');
  if (!reduced && (probe.getContext('webgl2') || probe.getContext('webgl'))) THREE = await import('three');
} catch (e) { THREE = null; }

let scene, camera, groups = {}, redrawFile = null, tick = null;
if (THREE) build();
document.fonts && document.fonts.ready.then(() => { if (redrawFile) redrawFile(); });
paintIdentity();
tell('leads-reveal-ready');
start();

function start() {
  ended = false; cutFired = {}; captionClear();
  t0 = performance.now();
  if (!THREE) { flatPlay(); return; }
  if (!running) { running = true; renderer.setAnimationLoop(loop); }
}

function build() {
  renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: !/Mobi/i.test(navigator.userAgent), powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(42, 1, .05, 100);
  const resize = () => { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  addEventListener('resize', resize); resize();
  scene.add(new THREE.HemisphereLight(0xdfe4ff, 0x101010, .9));
  const key = new THREE.SpotLight(0xffffff, 40, 30, .6, .5); key.position.set(3, 6, 8); scene.add(key);

  // a seeded random so every playback is the same film
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  /* ---------- 1. the monitor wall ---------- */
  const wall = new THREE.Group(); groups.wall = wall; scene.add(wall);
  const eyeCanvases = [0, 1, 2, 3].map(() => { const c = document.createElement('canvas'); c.width = 160; c.height = 120; return c; });
  const eyeTex = eyeCanvases.map(c => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; });
  const fileCanvas = document.createElement('canvas'); fileCanvas.width = 320; fileCanvas.height = 240;
  const fileTex = new THREE.CanvasTexture(fileCanvas); fileTex.colorSpace = THREE.SRGBColorSpace;
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: .7, metalness: .1 });
  const bezelMat = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: .5 });
  const screens = [];
  let center = null;
  for (let r = -1; r <= 1; r++) for (let c = -2; c <= 2; c++) {
    const tv = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.3, 1.2), bodyMat); tv.add(body);
    const bezel = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.12, .06), bezelMat); bezel.position.z = .61; tv.add(bezel);
    const isCenter = r === 0 && c === 0;
    const mat = new THREE.MeshBasicMaterial({ map: isCenter ? eyeTex[0] : eyeTex[(r + 1) * 5 + c + 2 & 3], toneMapped: false });
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.32, .98), mat); scr.position.z = .645; tv.add(scr);
    tv.position.set(c * 1.95 + (rnd() - .5) * .12, r * 1.5 + (rnd() - .5) * .1, (rnd() - .5) * .5 - Math.abs(c) * .25);
    tv.rotation.set((rnd() - .5) * .08, -c * .09 + (rnd() - .5) * .06, (rnd() - .5) * .05);
    if (isCenter) { tv.position.set(0, 0, 0); tv.rotation.set(0, 0, 0); center = { tv, mat }; }
    screens.push({ mat, dead: !isCenter && rnd() < .2 });
    wall.add(tv);
  }
  // CAM 03's label plate under the centre screen
  const label = (() => { const c = document.createElement('canvas'); c.width = 256; c.height = 48; const x = c.getContext('2d');
    x.fillStyle = '#c0c0c0'; x.fillRect(0, 0, 256, 48); x.fillStyle = '#000'; x.font = '700 26px "JetBrains Mono", monospace'; x.textAlign = 'center'; x.fillText('CAM 03', 128, 33);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(.6, .11), new THREE.MeshBasicMaterial({ map: label })); plate.position.set(0, -.6, .62); center.tv.add(plate);

  function drawEye(cv, look, lid, tint) {   // a photo-ish watching eye on a blue CRT, drawn small and stretched
    const x = cv.getContext('2d'), w = cv.width, h = cv.height;
    x.fillStyle = tint; x.fillRect(0, 0, w, h);
    const g = x.createRadialGradient(w / 2, h / 2, 5, w / 2, h / 2, w * .7); g.addColorStop(0, 'rgba(255,255,255,.16)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.save(); x.beginPath(); const ew = w * .38, eh = h * .27 * lid;
    x.moveTo(w / 2 - ew, h / 2); x.quadraticCurveTo(w / 2, h / 2 - eh * 2, w / 2 + ew, h / 2); x.quadraticCurveTo(w / 2, h / 2 + eh * 2, w / 2 - ew, h / 2); x.closePath();
    x.fillStyle = '#e9eaee'; x.fill(); x.clip();
    const ix = w / 2 + look.x * ew * .45, iy = h / 2 + look.y * eh * .4;
    x.fillStyle = '#2b2f36'; x.beginPath(); x.arc(ix, iy, h * .2, 0, 7); x.fill();
    x.fillStyle = '#050505'; x.beginPath(); x.arc(ix, iy, h * .09, 0, 7); x.fill();
    x.fillStyle = 'rgba(255,255,255,.85)'; x.beginPath(); x.arc(ix - h * .06, iy - h * .06, h * .03, 0, 7); x.fill();
    x.restore();
    x.lineWidth = 3; x.strokeStyle = '#050505'; x.beginPath();
    x.moveTo(w / 2 - ew, h / 2); x.quadraticCurveTo(w / 2, h / 2 - eh * 2, w / 2 + ew, h / 2); x.quadraticCurveTo(w / 2, h / 2 + eh * 2, w / 2 - ew, h / 2); x.stroke();
    x.fillStyle = 'rgba(0,0,0,.25)'; for (let y = 0; y < h; y += 3) x.fillRect(0, y, w, 1);   // scanlines baked in
  }
  function drawFile(t) {
    const x = fileCanvas.getContext('2d'), w = 320, h = 240;
    x.fillStyle = '#000ff0'; x.fillRect(0, 0, w, h);
    x.fillStyle = '#fff'; x.font = '800 22px "JetBrains Mono", monospace'; x.textAlign = 'left';
    x.fillText('SUBJECT ' + (who.id || '----'), 18, 44);
    x.font = '400 15px "JetBrains Mono", monospace';
    const lines = ['FILE: 26/27', 'OBSERVATION: COMPLETE', 'FINDINGS: ON FILE', 'STATUS: DECIDED'];
    const n = Math.floor(t * 9);
    lines.forEach((l, i) => x.fillText(l.slice(0, Math.max(0, n - i * 10)), 18, 84 + i * 26));
    x.fillStyle = '#fffc04'; x.fillRect(18, 196, Math.min(284, t * 160), 14);
    x.fillStyle = 'rgba(0,0,0,.22)'; for (let y = 0; y < h; y += 3) x.fillRect(0, y, w, 1);
    fileTex.needsUpdate = true;
  }

  /* ---------- 2. the LEADS eye (code-only take on the brand book wordmark: ink almond, red iris on the A) ---------- */
  const eye = new THREE.Group(); groups.eye = eye; scene.add(eye);
  const jitter = (pts, amt) => pts.map((p, i) => new THREE.Vector2(p.x + Math.sin(i * 12.9898) * amt, p.y + Math.cos(i * 78.233) * amt));
  function almond(w, h, n) {
    const s = new THREE.Shape(); s.moveTo(-w, 0); s.quadraticCurveTo(0, h * 2, w, 0); s.quadraticCurveTo(0, -h * 2, -w, 0);
    return s.getPoints(n);
  }
  const outer = new THREE.Shape(jitter(almond(3.3, 1.3, 90), .025));
  const innerPts = jitter(almond(2.98, 1.08, 90), .02);
  outer.holes.push(new THREE.Path(innerPts.slice().reverse()));
  const ink = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: .9 });
  eye.add(new THREE.Mesh(new THREE.ExtrudeGeometry(outer, { depth: .22, bevelEnabled: true, bevelSize: .02, bevelThickness: .03, bevelSegments: 2 }), ink));
  const lidGroup = new THREE.Group(); eye.add(lidGroup);   // everything that opens with the eye
  const sclera = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(innerPts)), new THREE.MeshBasicMaterial({ color: 0xfefffe, toneMapped: false }));
  sclera.position.z = .02; lidGroup.add(sclera);
  const irisMat = new THREE.MeshBasicMaterial({ color: 0xe50000, toneMapped: false });
  const iris = new THREE.Mesh(new THREE.CircleGeometry(.92, 64), irisMat); iris.position.z = .06; lidGroup.add(iris);
  const wordC = document.createElement('canvas'); wordC.width = 1024; wordC.height = 300;
  const wordT = new THREE.CanvasTexture(wordC); wordT.colorSpace = THREE.SRGBColorSpace;
  function drawWord() {
    const x = wordC.getContext('2d'); x.clearRect(0, 0, 1024, 300);
    x.fillStyle = '#050505'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = '400 250px Anton, "Arial Narrow", sans-serif';
    [['L', 208], ['E', 350], ['A', 512], ['D', 676], ['S', 822]].forEach(([ch, cx], i) => { x.save(); x.translate(cx, 156 + (i % 2 ? 6 : -4)); x.rotate((i - 2) * .025); x.fillText(ch, 0, 0); x.restore(); });
    wordT.needsUpdate = true;
  }
  const word = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 1.64), new THREE.MeshBasicMaterial({ map: wordT, transparent: true }));
  word.position.z = .1; lidGroup.add(word);
  // lashes: thin ink strokes along the upper lid, like the brushed version in the brand book
  const lashGeo = new THREE.PlaneGeometry(.035, 1); lashGeo.translate(0, .5, 0);
  const LASHES = 80, lashes = new THREE.InstancedMesh(lashGeo, new THREE.MeshBasicMaterial({ color: 0x050505 }), LASHES);
  const lid = new THREE.QuadraticBezierCurve(new THREE.Vector2(-3.3, 0), new THREE.Vector2(0, 2.6), new THREE.Vector2(3.3, 0));
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  for (let i = 0; i < LASHES; i++) {
    const u = .1 + .8 * i / (LASHES - 1), p = lid.getPoint(u), tg = lid.getTangent(u);
    const a = Math.atan2(tg.y, tg.x) + (Math.sin(i * 3.1) * .12);   // perpendicular to the lid line, a little brushed
    q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), a); sc.set(.8 + (i % 3) * .25, .12 + (Math.sin(i * 7.7) * .5 + .5) * .2, 1);
    m4.compose(new THREE.Vector3(p.x, p.y + .04, .12), q, sc); lashes.setMatrixAt(i, m4);
  }
  eye.add(lashes);
  // the "26/27" corner marks from the wordmark
  const yr = (() => { const c = document.createElement('canvas'); c.width = 512; c.height = 96; const x = c.getContext('2d');
    x.fillStyle = '#050505'; x.font = '400 72px "JetBrains Mono", monospace'; x.fillText('26', 0, 72); x.textAlign = 'right'; x.fillText('27', 512, 72);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
  const years = new THREE.Mesh(new THREE.PlaneGeometry(7.6, 1.42), new THREE.MeshBasicMaterial({ map: yr, transparent: true })); years.position.set(0, 1.55, 0); eye.add(years);
  // the mirror: the iris turns to silver and there is a figure in it. The observer was a mirror all along.
  const mirC = document.createElement('canvas'); mirC.width = 512; mirC.height = 512;
  (() => { const x = mirC.getContext('2d');
    const g = x.createRadialGradient(200, 170, 20, 256, 256, 300); g.addColorStop(0, '#ffffff'); g.addColorStop(.35, '#c9ced4'); g.addColorStop(.75, '#7d848c'); g.addColorStop(1, '#3b4046');
    x.fillStyle = g; x.fillRect(0, 0, 512, 512);
    x.fillStyle = 'rgba(10,12,14,.88)';   // head and shoulders, seen from the front
    x.beginPath(); x.ellipse(256, 236, 62, 78, 0, 0, 7); x.fill();
    x.beginPath(); x.moveTo(110, 512); x.bezierCurveTo(120, 380, 180, 330, 256, 330); x.bezierCurveTo(332, 330, 392, 380, 402, 512); x.fill();
    x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.ellipse(170, 130, 70, 22, -.6, 0, 7); x.fill();   // a highlight streak
    x.globalCompositeOperation = 'destination-in'; x.beginPath(); x.arc(256, 256, 256, 0, 7); x.fill(); })();
  const mirT = new THREE.CanvasTexture(mirC); mirT.colorSpace = THREE.SRGBColorSpace;
  const mirror = new THREE.Mesh(new THREE.CircleGeometry(.92, 64), new THREE.MeshBasicMaterial({ map: mirT, transparent: true, toneMapped: false }));
  mirror.position.z = .07; lidGroup.add(mirror);

  /* ---------- 3. the case file ---------- */
  const file = new THREE.Group(); groups.file = file; scene.add(file);
  const manila = new THREE.MeshStandardMaterial({ color: 0xd3bc86, roughness: .9 });
  const back = new THREE.Mesh(new THREE.BoxGeometry(4.6, 3.3, .04), manila); file.add(back);
  const tab = new THREE.Mesh(new THREE.BoxGeometry(1.5, .34, .04), manila); tab.position.set(-1.35, 1.8, 0); file.add(tab);
  const formC = document.createElement('canvas'); formC.width = 1024; formC.height = 720;
  const formT = new THREE.CanvasTexture(formC); formT.colorSpace = THREE.SRGBColorSpace; formT.anisotropy = 4;
  const paper = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 2.95), new THREE.MeshStandardMaterial({ map: formT, roughness: 1 }));
  paper.position.set(.08, -.06, .03); paper.rotation.z = -.015; file.add(paper);
  const stampC = document.createElement('canvas'); stampC.width = 1024; stampC.height = 300;
  const stampT = new THREE.CanvasTexture(stampC); stampT.colorSpace = THREE.SRGBColorSpace;
  const stamp = new THREE.Mesh(new THREE.PlaneGeometry(3.3, .97), new THREE.MeshBasicMaterial({ map: stampT, transparent: true, depthWrite: false }));
  stamp.position.set(.5, -.45, .06); stamp.rotation.z = .12; file.add(stamp);
  function drawForm() {
    const x = formC.getContext('2d'), w = 1024, h = 720;
    x.fillStyle = '#efe9d8'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) { x.fillStyle = 'rgba(60,45,20,' + (Math.random() * .06) + ')'; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }   // xerox grain
    x.fillStyle = '#1b1b1b'; x.font = '800 40px "JetBrains Mono", monospace'; x.fillText('INTAKE // CASE FILE 26/27', 56, 86);
    x.font = '400 26px "JetBrains Mono", monospace';
    const rows = [['SUBJECT NO.', who.id || '----'], ['NAME', who.nick ? who.nick.toUpperCase() : '[REDACTED]'], ['OBSERVATION', 'COMPLETE'], ['FINDING', '']];
    rows.forEach(([k, v], i) => { const y = 170 + i * 92; x.fillStyle = '#555'; x.fillText(k, 56, y); x.fillStyle = '#1b1b1b'; x.fillText(v, 380, y);
      x.fillRect(370, y + 14, 590, 2); });
    // the photo corner: an empty frame (your face goes here)
    x.strokeStyle = '#1b1b1b'; x.lineWidth = 3; x.strokeRect(780, 40, 180, 110); x.font = '400 18px "JetBrains Mono", monospace'; x.fillStyle = '#777'; x.fillText('PHOTO', 836, 102);
    // the crossed-out date peg
    x.font = '700 34px "JetBrains Mono", monospace'; x.fillStyle = '#1b1b1b'; x.fillText('DUE  NOV 11 2026', 56, 650);
    x.strokeStyle = '#1b1b1b'; x.lineWidth = 4; x.beginPath(); x.moveTo(50, 640); x.bezierCurveTo(200, 620, 300, 660, 420, 628); x.stroke();
    formT.needsUpdate = true;
    const s = stampC.getContext('2d'); s.clearRect(0, 0, 1024, 300);
    s.save(); s.globalAlpha = .9; s.strokeStyle = '#e50000'; s.lineWidth = 16; s.strokeRect(24, 24, 976, 252);
    s.fillStyle = '#e50000'; s.textAlign = 'center'; s.textBaseline = 'middle'; s.font = '400 190px Anton, "Arial Narrow", sans-serif'; s.fillText(who.stamp, 512, 160);
    s.globalCompositeOperation = 'destination-out';   // worn ink
    for (let i = 0; i < 900; i++) { s.globalAlpha = Math.random() * .7; s.fillRect(Math.random() * 1024, Math.random() * 300, 3 + Math.random() * 6, 2 + Math.random() * 3); }
    s.restore(); stampT.needsUpdate = true;
  }
  redrawFile = () => { drawWord(); drawForm(); };
  redrawFile();

  /* ---------- the film ---------- */
  const look = new THREE.Vector2();
  addEventListener('pointermove', e => { look.set(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1); });
  const shake = new THREE.Vector3();
  // camera distance that fits a w x h subject on this screen (phones are tall, laptops are wide)
  const fit = (w, h) => { const v = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)); return Math.max(h / 2 / v, w / 2 / (v * camera.aspect)); };
  tick = t => {
    const W = t < 7, E = t >= 7 && t < 11, F = t >= 11;
    wall.visible = W; eye.visible = E; file.visible = F;
    scene.background = new THREE.Color(E ? 0xfefffe : F ? 0x0d0b08 : 0x050505);
    // static: heavy at the start and at every cut
    const cutNoise = Math.max(0, 1 - Math.abs(t - 3) * 6) + Math.max(0, 1 - Math.abs(t - 7) * 7) + Math.max(0, 1 - Math.abs(t - 11) * 7);
    paintStatic(Math.min(.9, (t < 2.6 ? .55 - t * .12 : 0) + cutNoise * .8));
    if (live()) { drone.gain.value = E ? .35 : F ? .5 : .7; hiss.gain.value = .02 + Math.min(.12, cutNoise * .15) + (t < 2.6 ? .05 : 0); }
    if (t >= 3) fireOnce('c3', () => noiseBurst(.3, .6));
    if (t >= 7) fireOnce('c7', () => { flash(.9); noiseBurst(.35, .8); });
    if (t >= 11) fireOnce('c11', () => { flash(.5); noiseBurst(.3, .7); });

    if (t < 3) {   // dead CRT: only the HUD and the words
      wall.visible = false;
      caption('We have been watching.', .6, t, 30);
    } else if (W) {
      const k = span(t, 3, 6.9);
      const far = fit(10.5, 5), near = .645 + fit(1.5, 1.12);
      camera.position.set(Math.sin(t * .7) * .25 * (1 - k), .15 * (1 - k), far - (far - near) * k * k);
      camera.lookAt(0, 0, 0);
      eyeCanvases.forEach((cv, i) => {
        const dart = Math.sin(t * (1.3 + i * .37) + i) > .7 ? .5 : 0;
        const blink = (Math.sin(t * 2.1 + i * 2) > .985) ? .15 : 1;
        drawEye(cv, { x: -camera.position.x * .2 + Math.sin(t * .9 + i) * .25 + dart, y: Math.cos(t * .8 + i) * .2 }, blink, i === 0 ? '#000ff0' : '#0a1aa8');
        eyeTex[i].needsUpdate = true;
      });
      screens.forEach((s, i) => { if (s.dead) s.mat.color.setScalar(Math.random() < .5 ? .15 : .5); });
      if (t > 5.3) { center.mat.map = fileTex; drawFile(t - 5.3); } else center.mat.map = eyeTex[0];
      center.mat.needsUpdate = true;
      t < 5.3 ? caption('Please remain seated.', 3.4, t, 30) : caption('Subject ' + (who.id ? who.id.replace('APP-', '') : '000') + ', your file is ready.', 5.4, t, 34);
    } else if (E) {
      const open = t < 7.25 ? .04 : t < 7.9 ? span(t, 7.25, 7.9) : t < 8.4 ? 1 - .92 * Math.sin(span(t, 7.9, 8.4) * Math.PI) : 1;   // opens, one slow blink
      lidGroup.scale.y = Math.max(.04, open); lashes.scale.y = .6 + open * .4;
      const push = span(t, 9.4, 10.95);
      // the eye sits in the upper part of the frame so the caption below never crosses its ink line;
      // it slides back to centre as the camera pushes into the iris
      const lift = 1.25 * (1 - push);
      eye.position.y = lift;
      const wide = fit(7.8, 5.4 + lift * 2.4), close = .07 + fit(2.1, 2.1) * .85;
      camera.position.set(0, 0, wide - push * (wide - close)); camera.lookAt(0, 0, 0);
      // the iris watches the pointer (or drifts), then settles dead centre: it's looking at you
      const settle = span(t, 8.6, 9.2);
      iris.position.x = mirror.position.x = (look.x * .35 + Math.sin(t * 1.7) * .2) * (1 - settle);
      iris.position.y = mirror.position.y = (-look.y * .18) * (1 - settle);
      const m = span(t, 9.0, 9.6);   // iris -> mirror
      iris.visible = m < 1; irisMat.opacity = 1 - m; irisMat.transparent = m > 0;
      mirror.visible = m > 0; mirror.material.opacity = m; mirror.scale.setScalar(.85 + .15 * m);
      word.material.opacity = 1 - span(t, 9.8, 10.4);
      eye.rotation.y = Math.sin(t * .6) * .05 * (1 - push); eye.rotation.x = Math.cos(t * .5) * .03 * (1 - push);
      $('cap').classList.add('ink');
      t < 9 ? caption('I can see you.', 7.5, t, 26) : caption('Do you see yourself?', 9.1, t, 26);
    } else {
      $('cap').classList.remove('ink');
      const slam = span(t, 11.55, 11.85);
      const d = fit(5.1, 3.9);
      camera.position.set(.2 - span(t, 11, 13.6) * .3, -.1, d * (1.08 - span(t, 11, 13.6) * .14)); camera.lookAt(0, -.1, 0);
      file.rotation.set(-.12, .1 - span(t, 11, 13) * .1, -.02);
      stamp.visible = t >= 11.55;
      const s = 2.6 - 1.6 * slam; stamp.scale.set(s, s, 1); stamp.position.z = .06 + (1 - slam) * 2.2; stamp.material.opacity = Math.min(1, slam * 3);
      if (t >= 11.85) fireOnce('slam', () => { thud(); flash(.25); shake.set(.12, .1, 0); });
      shake.multiplyScalar(.86); camera.position.add(new THREE.Vector3((Math.random() - .5) * shake.x, (Math.random() - .5) * shake.y, 0));
      if (t > 12.3) caption('Finding: ' + who.stamp.toLowerCase() + '.', 12.3, t, 30);
    }
  };
}

function loop() {
  if (ended && cutFired.done) return renderer.setAnimationLoop(null), running = false;
  const t = isNaN(FREEZE) ? Math.min(DUR, (performance.now() - t0) / 1000) : FREEZE;   // ?at=8.5 freezes a frame (for review)
  tick(t);
  renderer.render(scene, camera);
  if (t >= END_AT && !ended) { finish(); cutFired.done = true; }
}
</script>
</body>
</html>
