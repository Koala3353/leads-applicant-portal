<!-- Mascot.html  (shared: I.R.I.S., the wall-mounted CCTV camera in the bottom-right corner.)
     I.R.I.S. = Inspection, Reconnaissance & Identification System. Its lens is a real-looking eye; the whole camera head
     pans and tilts to follow the pointer, a status LED and a small LCD show its state, and hovering it shows your own
     silhouette reflected in the lens (the brand book's mirror: the observer is you).
     Every page adds it right after the Loader line, as a force-print scriptlet:
       includeOptional_('Mascot', { BRAND: BRAND, page: page })   (optional: if it breaks, the page still loads)
     Words, faces and LED colours live in Brand.gs (BRAND.mascot). Set BRAND.mascot.show = false to turn it off.
     Faces (kept for every page's existing calls): nervous, happy, excited, sad, scared, wink, love, thinking (+ off for
     Apply's power-on intro). Each face sets the LED colour, the LCD word, the aperture and the head angle.
     Every ~7 seconds it idles: a body move (MOVES_IDLE) alternating with a lens effect (EFFECTS); never one of its last three.
     Errors: it turns red and says BRAND.mascot.error on 'hub:error', 'portal:error', or an unhandled error.
     Pages make it talk with window.Iris.say([face, text]) (window.Kuya is the same object).
     Never write a real scriptlet tag in a comment here: Apps Script runs scriptlets even inside comments. -->

<script>
  (function () {
    const M = <?!= mascotJson_() ?>;
    const PAGE = <?!= JSON.stringify(String(page || 'home')).replace(/</g, '\\u003c') ?>;
    const FACES = ['nervous', 'happy', 'excited', 'sad', 'scared', 'wink', 'love', 'thinking'];
    const MOVES = { excited: 'hop', scared: 'scared' };   // faces that come with a little move
    const MOVES_IDLE = ['scan', 'nod', 'recoil', 'shiver', 'jolt', 'crane', 'peek'];                            // camera head moves (scan = sweeps the room)
    const EFFECTS = ['glitch', 'static', 'stare', 'panic', 'irmode', 'refocus', 'shutter', 'flash', 'mirror'];  // lens effects (mirror = the lens shows you)
    const TRICK_MS = { peek: 2700, crane: 2300, nod: 1900, irmode: 2600, refocus: 1600, mirror: 1900, shutter: 1000 };
    const LCD = { nervous: 'REC', happy: 'NOTED', excited: 'MATCH', sad: 'IDLE', scared: 'ALERT', wink: 'SAVED', love: 'CLEARED', thinking: 'READING', off: '' };
    const TRICKS = MOVES_IDLE.concat(EFFECTS);
    const TRICK_EVERY = 7000;                             // ms between idle tricks
    const KEY = 'leads-kuya-hidden';
    const root = document.getElementById('kuya');
    const bubble = document.getElementById('kuyaBubble');
    const text = document.getElementById('kuyaText');
    const cursor = document.getElementById('kuyaCursor');
    const btn = document.getElementById('kuyaBtn');
    const iris = document.getElementById('kuyaIris');
    let timer = null, typeTimer = null, lastTip = -1, spoke = false;

    function stopTyping() {
      if (typeTimer) { clearTimeout(typeTimer); typeTimer = null; }
      if (cursor) cursor.hidden = true;
    }

    const recall = document.getElementById('kuyaRecall');
    recall.textContent = '\u25A3 ' + (M.name || 'I.R.I.S.');
    recall.setAttribute('aria-label', 'Show ' + (M.name || 'I.R.I.S.') + ' again');
    recall.addEventListener('click', function () {
      try { sessionStorage.removeItem(KEY); } catch (e) { /* fine */ }
      recall.hidden = true; root.hidden = false; replay('peek');
    });
    let startHidden = false;
    try { startHidden = sessionStorage.getItem(KEY) === '1'; } catch (e) { /* storage blocked: just show Kuya */ }

    const NAME = M.name || 'I.R.I.S.';
    document.getElementById('kuyaName').textContent = NAME + ' // transmission';
    document.getElementById('kuyaHide').textContent = M.hideLabel || 'Hide';
    btn.setAttribute('aria-label', NAME + (M.fullName ? ' (' + M.fullName + ')' : '') + ', the LEADS mascot. Tap for a message.');

    // A line is [face, text] or just 'text'.
    function parse(line) {
      if (Array.isArray(line)) return line.length > 1 ? { face: line[0], text: line[1] } : { face: '', text: line[0] };
      return { face: '', text: line };
    }
    const okFace = f => FACES.indexOf(f) >= 0 ? f : 'nervous';
    let rest = okFace((M.pageFace || {})[PAGE] || parse((M.hello || {})[PAGE]).face);   // face when Kuya is quiet

    function replay(cls) {
      root.classList.remove('peek', 'scared', 'hop', 'poke');
      void root.offsetWidth;                 // restart the animation
      root.classList.add(cls);
    }

    function setFace(f, animate) {
      f = okFace(f);
      root.dataset.mood = f;
      const lcd = document.getElementById('kuyaLcd'); if (lcd) lcd.textContent = LCD[f] || 'REC';
      const c = (M.colors || {})[f];
      if (c) root.style.setProperty('--kuya-c', c); else root.style.removeProperty('--kuya-c');
      if (animate && MOVES[f]) replay(MOVES[f]);
    }

    function say(line, ms) {
      const l = parse(line);
      if (!l.text) return;
      spoke = true;
      const targetText = String(l.text);
      setFace(l.face, true);
      bubble.hidden = false;
      clearTimeout(timer);
      stopTyping();

      const isCalm = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ||
                     document.documentElement.classList.contains('calm');
      if (isCalm) {
        text.textContent = targetText;
        timer = setTimeout(function () { bubble.hidden = true; setFace(rest); }, ms || 7000);
        return;
      }

      text.textContent = '';
      if (cursor) cursor.hidden = false;
      let idx = 0;

      function typeNext() {
        if (idx >= targetText.length) {
          stopTyping();
          timer = setTimeout(function () { bubble.hidden = true; setFace(rest); }, ms || 7000);
          return;
        }

        const ch = targetText.charAt(idx);
        idx++;
        text.textContent = targetText.slice(0, idx);

        if (idx >= targetText.length) {
          stopTyping();
          timer = setTimeout(function () { bubble.hidden = true; setFace(rest); }, ms || 7000);
          return;
        }

        // Punctuation pauses: short pause for , ; : and longer pause for . ! ?
        let delay = 25; // standard typing pace
        if (ch === ',' || ch === ';' || ch === ':') {
          delay = 200; // short pause
        } else if (ch === '.') {
          const next = targetText.charAt(idx);
          if (next === '.') {
            delay = 90; // smooth pacing through ellipsis dots (...)
          } else if (/[A-Za-z0-9]/.test(next)) {
            delay = 60; // abbreviation dot (e.g. I.R.I.S., v1.0)
          } else {
            delay = 420; // longer pause for periods ending a sentence or clause
          }
        } else if (ch === '!' || ch === '?') {
          delay = 420; // longer pause for sentence terminators
        }

        typeTimer = setTimeout(typeNext, delay);
      }

      typeTimer = setTimeout(typeNext, 25);
    }

    function randomTip() {
      const tips = M.tips || [];
      if (!tips.length) return '';
      let i = Math.floor(Math.random() * tips.length);
      if (tips.length > 1 && i === lastTip) i = (i + 1) % tips.length;
      lastTip = i;
      return tips[i];
    }

    /* ---------- the eye follows the pointer (and sweeps around during the "scan" trick) ---------- */
    let px = innerWidth / 2, py = innerHeight / 2, scanning = 0, queued = false;
    function look() {
      queued = false;
      if (scanning) return;
      const r = btn.getBoundingClientRect();
      // the camera faces the side of the screen with more page in it; the whole head turns toward the pointer
      // (within its mount's range), then the eye aims. Facing right, the drawing is mirrored, so x flips.
      const right = r.left + r.width / 2 < innerWidth / 2;
      root.classList.toggle('facing-right', right);
      const ex = r.left + r.width * (right ? .8 : .2), ey = r.top + r.height * .37;
      const dx = (px - ex) * (right ? -1 : 1), dy = py - ey, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 220);
      const ang = Math.atan2(dy, -dx) * 180 / Math.PI;                // 0 = straight ahead, + = below, - = above
      root.style.setProperty('--pan', Math.max(-34, Math.min(30, -ang * .6)).toFixed(1) + 'deg');
      aim(dx / d * k, dy / d * k);
    }
    function aim(ux, uy) { iris.style.transform = 'translate(' + (ux * 3.2).toFixed(2) + 'px,' + (uy * 2.6).toFixed(2) + 'px)'; }
    function onMove(x, y) { px = x; py = y; if (!queued) { queued = true; requestAnimationFrame(look); } }
    window.addEventListener('pointermove', e => onMove(e.clientX, e.clientY), { passive: true });
    window.addEventListener('touchstart', e => { const t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: true });
    window.addEventListener('scroll', () => onMove(px, py), { passive: true });

    /* ---------- drag Kuya anywhere (mouse or finger); the spot is remembered in this browser ---------- */
    // phones and desktops remember separate spots (a desktop spot would land mid-screen on a phone)
    const POS_KEY = innerWidth <= 560 ? 'leads-kuya-pos-m' : 'leads-kuya-pos';
    let drag = null, dragged = false;
    function place(x, y, save) {
      if (PAGE === 'apply') return;   // I.R.I.S. is strictly anchored on the apply page
      const w = btn.offsetWidth, h = btn.offsetHeight;
      x = Math.max(4, Math.min(innerWidth - w - 4, x));
      y = Math.max(4, Math.min(innerHeight - h - 4, y));
      root.classList.add('placed');
      root.classList.toggle('on-left', x + w / 2 < innerWidth / 2);
      root.classList.toggle('on-top', y + h / 2 < innerHeight / 2);
      // the root holds the bubble too, so position it from the button's corner
      const bub = bubble.hidden ? 0 : bubble.offsetHeight + 10;
      root.style.left = (root.classList.contains('on-left') ? x : x + w - root.offsetWidth) + 'px';
      root.style.top = (root.classList.contains('on-top') ? y : y - bub) + 'px';
      root.dataset.x = x; root.dataset.y = y;
      if (save) { try { localStorage.setItem(POS_KEY, JSON.stringify({ x: x / innerWidth, y: y / innerHeight })); } catch (e) { /* fine */ } }
    }
    function replace() { if (root.classList.contains('placed') && !root.classList.contains('dragging')) place(+root.dataset.x, +root.dataset.y, false); }
    // Dragging: one position update per frame; the message box closes while you carry I.R.I.S.
    // (so it can't flip sides mid-drag), idle tricks stop, and it settles with a small squash on drop.
    let frame = 0, nextX = 0, nextY = 0;
    function startDrag() {
      dragged = true;
      root.classList.add('dragging');
      clearTricks();
      stopTyping(); clearTimeout(timer); bubble.hidden = true;
    }
    function endDrag(save) {
      if (!drag) return;
      cancelAnimationFrame(frame); frame = 0;
      if (dragged && save) { place(nextX, nextY, true); replay('poke'); }
      drag = null; root.classList.remove('dragging');
    }
    btn.addEventListener('pointerdown', function (e) {
      if (PAGE === 'apply') return;   // docked bottom-left on Apply (see Apply.html)
      if (e.button !== 0 || drag) return;   // left button only; ignore a second finger
      const r = btn.getBoundingClientRect();
      drag = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top, sx: e.clientX, sy: e.clientY };
      dragged = false;
      try { btn.setPointerCapture(e.pointerId); } catch (err) { /* old browsers: still works while over the button */ }
    });
    btn.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      if (!dragged) {
        if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;   // small wobble = still a tap
        startDrag();
      }
      nextX = e.clientX - drag.dx; nextY = e.clientY - drag.dy;
      if (!frame) frame = requestAnimationFrame(() => { frame = 0; place(nextX, nextY, false); });
    });
    btn.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) endDrag(true); });
    btn.addEventListener('pointercancel', () => endDrag(true));
    btn.addEventListener('lostpointercapture', () => endDrag(true));
    // keyboard: arrow keys move I.R.I.S. (Shift = bigger steps), so it's not mouse-only
    btn.addEventListener('keydown', function (e) {
      if (PAGE === 'apply') return;
      const step = e.shiftKey ? 48 : 16, d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
      if (!d) return;
      e.preventDefault();
      const r = btn.getBoundingClientRect();
      place(r.left + d[0], r.top + d[1], true);
    });
    window.addEventListener('resize', replace);
    new MutationObserver(replace).observe(bubble, { attributes: true, attributeFilter: ['hidden'] });   // bubble opened/closed: keep I.R.I.S. still
    // a new message changes the bubble's size while it's open; re-anchor so the button doesn't jump
    // (moved to the next frame: moving I.R.I.S. inside the callback would trigger another resize round)
    if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(replace)).observe(bubble);
    try {
      if (PAGE !== 'apply') {
        const p = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
        if (p) requestAnimationFrame(() => place(p.x * innerWidth, p.y * innerHeight, false));
      }
    } catch (e) { /* no saved spot */ }

    btn.addEventListener('click', function (e) {
      if (dragged) { dragged = false; e.preventDefault(); return; }   // a drag isn't a tap
      if (root.dataset.mood === 'off') {
        document.dispatchEvent(new CustomEvent('iris:wake'));
        return;
      }
      replay('poke');
      say(spoke ? randomTip() : ((M.hello || {})[PAGE] || randomTip()));
    });

    document.getElementById('kuyaHide').addEventListener('click', function () {
      stopTyping();
      clearTimeout(timer);
      bubble.hidden = true;
      root.hidden = true;
      recall.hidden = false;
      try { sessionStorage.setItem(KEY, '1'); } catch (e) { /* fine: hidden until reload */ }
    });

    // Home: react to what the hub loaded (status, guest, officer). The status face becomes the resting face.
    function onContext(ctx) {
      if (!ctx) return;
      const st = ctx.applicant && ctx.applicant.status;
      const byStatus = st && M.status && M.status[st];
      if (byStatus) rest = okFace(parse(byStatus).face);
      say(byStatus || (ctx.isAdmin && M.admin) || (!ctx.signedIn && M.guest) || (M.hello || {})[PAGE], 9000);
    }
    document.addEventListener('hub:context', function (e) {
      try { onContext(e.detail); } catch (err) { console.error('Mascot:', err); }
    });

    // Errors: Kuya panics (red + shake), says BRAND.mascot.error, then rests with a sad face.
    // Heard from: the hub failing to load ('hub:error'), any page's own failure handler ('portal:error'),
    // and server errors no page handled (Apps Script throws those as uncaught errors).
    let lastError = 0;
    function onError() {
      if (Date.now() - lastError < 4000) return;       // one reaction per burst of errors
      lastError = Date.now();
      rest = okFace(M.afterError || 'sad');
      say(M.error || ['scared', 'Something went wrong. Try reloading.'], 12000);
    }
    const safe = fn => function () { try { fn(); } catch (err) { console.error('Mascot:', err); } };
    document.addEventListener('hub:error', safe(onError));
    document.addEventListener('portal:error', safe(onError));
    window.addEventListener('error', safe(onError));
    window.addEventListener('unhandledrejection', safe(onError));
    window.Kuya = {
      error: safe(onError),
      say: function (line, ms) { try { say(line, ms); } catch (e) { /* never break the page */ } },
      setFace: function (f, anim) { try { setFace(f, anim); } catch (e) {} },
      replay: function (cls) { try { replay(cls); } catch (e) {} }
    };
    window.Iris = window.Kuya;   // Iris is the current name; Kuya kept so earlier page code still works

    // Idle tricks: a random one every TRICK_EVERY ms. Skipped while the tab is hidden,
    // right after someone taps Kuya, or when the device asks for reduced motion.
    let lastTap = 0, turn = 0;
    const recent = [];
    btn.addEventListener('click', function () { if (!dragged) lastTap = Date.now(); });
    const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function clearTricks() { TRICKS.forEach(x => root.classList.remove('trick-' + x)); }
    function trick() {
      if (calm || root.hidden || document.hidden || document.documentElement.classList.contains('calm') || Date.now() - lastTap < 3000) return;
      if (root.classList.contains('dragging')) return;
      if (root.dataset.mood === 'off') return;   // powered off (Apply's wake-up intro): no tricks until it's switched on
      const pool = (turn++ % 2) ? EFFECTS : MOVES_IDLE;   // alternate: a body animation, then a screen effect
      const fresh = pool.filter(x => recent.indexOf(x) < 0);   // never one of the last three
      const t = fresh[Math.floor(Math.random() * fresh.length)];
      recent.push(t); if (recent.length > 3) recent.shift();
      if (t === 'panic') {                              // only while quiet, so it never fights a message
        if (!bubble.hidden) return;
        setFace('scared', true);
        setTimeout(function () { if (bubble.hidden) setFace(rest); }, 1800);
        return;
      }
      if (t === 'scan') {                               // the eye sweeps left, right, then back to you
        const path = [[-1, -.2, -26], [1, -.2, 20], [-.6, .6, -8], [0, 0, 0]];
        scanning = 1;
        path.forEach((p, i) => setTimeout(() => { aim(p[0], p[1]); root.style.setProperty('--pan', p[2] + 'deg'); }, i * 420));
        setTimeout(() => { scanning = 0; look(); }, path.length * 380 + 200);
        return;
      }
      clearTricks();
      void root.offsetWidth;
      root.classList.add('trick-' + t);
      setTimeout(clearTricks, TRICK_MS[t] || 1800);
    }
    setInterval(trick, TRICK_EVERY);

    // Leave the tab for 5+ seconds and Kuya notices when you come back.
    let leftAt = 0;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { leftAt = Date.now(); return; }
      if (leftAt && Date.now() - leftAt > 5000 && M.back) setTimeout(() => say(M.back, 5000), 400);
      leftAt = 0;
    });

    setFace(rest);
    root.hidden = startHidden;
    recall.hidden = !startHidden;
    if (!startHidden) replay('peek');
    look();
    // Pages without the hub just say hello once the loader is gone.
    setTimeout(function () {
      try {
        if (spoke) return;
        if (window.HUB && window.HUB.type === 'error') return onError();
        if (window.HUB && window.HUB.type === 'context') return onContext(window.HUB.detail);
        if (PAGE !== 'home' && PAGE !== 'apply') say((M.hello || {})[PAGE]);
      } catch (err) { console.error('Mascot:', err); }
    }, 1200);
  })();
</script>
