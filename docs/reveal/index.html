<!doctype html>
<!--
  Eyes on LEADS: the results reveal, Act 2 (GitHub Pages, not Apps Script; clasp ignores docs/).
  Act 1 is docs/results/, the public page the acceptance email links to. It ends on the LEADS eye opening and sends
  them into the portal with ?reveal=1; the portal (Home.html) then opens this page full screen, once, for an ACCEPTED
  applicant, and says who it is with postMessage:
      { type: 'leads-reveal-init', id: 'APP-2306', nick: 'Bea', stamp: 'ACCEPTED', sound: true }
  so the page itself never states anyone's result (opened on its own it says REVIEWED). It answers with
  'leads-reveal-ready' (fonts loaded, about to play), 'leads-reveal-replay' (started again, so the portal resets its
  safety timer) and 'leads-reveal-done' (closed from the end card).
  ~9.5 s, all drawn in one 2D canvas by ink.js (shared with Act 1), in the style of the party video: red field,
  boiling hand-drawn lines, a scribble glitch. Then the brand book's Broadcast Card. No triangle eye.
  ?at=7.6 freezes a frame (for review).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Eyes on LEADS // Transmission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Special+Elite&display=swap">
<link rel="modulepreload" href="ink.js">
<style>
  :root{--black:#050505;--white:#fefffe;--blue:#000ff0;--yellow:#fffc04;--red:#e50000;--field:#d4260a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--field);color:var(--white);overflow:hidden;font-family:'JetBrains Mono',ui-monospace,monospace}
  #film{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;z-index:3;margin:0;font:700 clamp(11px,1.6vw,13px)/1.2 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--white);pointer-events:none}
  #rec{top:max(16px,env(safe-area-inset-top));left:16px}
  #rec i{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--white);margin-right:.5em;vertical-align:-.05em;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #clock{top:max(16px,env(safe-area-inset-top));right:16px;font-variant-numeric:tabular-nums}
  #subject{top:calc(max(16px,env(safe-area-inset-top)) + 22px);left:16px;opacity:.85}
  /* captions sit under the subject (the eye and the file are drawn in the upper part of the frame) */
  #cap{position:fixed;z-index:3;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 70px);transform:translateX(-50%);max-width:min(92vw,760px);
    margin:0;text-align:center;pointer-events:none;font:800 clamp(17px,3.6vw,30px)/1.2 'JetBrains Mono',monospace;letter-spacing:-.01em;text-transform:uppercase;color:var(--black)}
  #cap:not(:empty){padding:.25em .6em;background:var(--white);box-shadow:4px 4px 0 var(--black)}
  #cap .cur{display:inline-block;width:.55em;height:.95em;background:currentColor;vertical-align:-.1em;margin-left:.1em;animation:blink .8s steps(1) infinite}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ctl{position:fixed;z-index:5;bottom:max(14px,env(safe-area-inset-bottom));right:14px;display:flex;gap:8px;transition:opacity .3s}
  .ctl.gone{opacity:0;pointer-events:none}
  button{font:700 13px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
    min-height:44px;padding:0 16px;border:0;color:#000;background:#c0c0c0;
    box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf,3px 3px 0 #000}
  button:active{box-shadow:inset 1px 1px #0a0a0a,inset -1px -1px #fff,inset 2px 2px #808080}
  button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
  .snd-ic{vertical-align:-2px;margin-right:4px}
  /* the last frame: a Broadcast Card with the way out */
  .end{position:fixed;inset:0;z-index:4;display:grid;place-items:end center;padding:20px 16px max(24px,env(safe-area-inset-bottom));opacity:0;pointer-events:none;transition:opacity .4s ease}
  .end.on{opacity:1;pointer-events:auto}
  .card{width:min(560px,100%);background:var(--blue);color:#fff;text-align:center;padding:24px 20px 22px;rotate:-1deg;
    box-shadow:0 0 0 4px #000,0 0 0 7px var(--blue),8px 10px 0 7px #000}
  .card p{margin:0}
  .card .k{font:700 12px/1.4 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--yellow)}
  .card .t{font:800 clamp(32px,9vw,58px)/.95 'JetBrains Mono',monospace;letter-spacing:-.04em;text-transform:uppercase;margin:10px 0 12px}
  .card .s{font:400 15px/1.5 'JetBrains Mono',monospace}
  .card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .card .go{background:var(--yellow)}
  @media (prefers-reduced-motion:reduce){#rec i,#cap .cur{animation:none}.end{transition:none}}
</style>
</head>
<body>
<canvas id="film" aria-hidden="true"></canvas>
<p class="hud" id="rec" aria-hidden="true"><i></i>REC &nbsp;CAM 03</p>
<p class="hud" id="clock" aria-hidden="true">--:--:--</p>
<p class="hud" id="subject" aria-hidden="true">SUBJECT ----</p>
<p id="cap" aria-hidden="true"></p>
<p class="sr" id="capLive" role="status" aria-live="polite"></p>
<div class="ctl" id="ctl">
  <button type="button" id="sound" aria-pressed="false"></button>
  <button type="button" id="skip">Skip ▸▸</button>
</div>
<div class="end" id="end" role="dialog" aria-modal="true" aria-labelledby="endT" aria-describedby="endS">
  <div class="card">
    <p class="k" id="endK">Transmission ends</p>
    <p class="t" id="endT">Your file is ready</p>
    <p class="s" id="endS">Come and see what we found.</p>
    <div class="row"><button type="button" class="go" id="open">Open your file</button><button type="button" id="replay">Replay</button></div>
  </div>
</div>

<script type="module">
import { C, reduced, boil, span, backOut, stage, partyEye, wordEye, scribble, grain, glitch, shake, makeSound, SPEAKER, captions, fontsReady } from './ink.js';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const embedded = window.parent !== window;
const FREEZE = parseFloat(params.get('at'));
const PORTAL = 'https://script.google.com/a/macros/student.ateneo.edu/s/AKfycbwoL5I-i10w25U-nNqAlwfVEDF0NuQhWEHZq_EqMu9t3pszFNH72FuXhYXAH1TH2Fk/exec';

/* ============================== who is watching (from the portal) ============================== */
const who = { id: '', nick: '', stamp: 'REVIEWED' };
const clean = (v, n) => String(v || '').replace(/[^\w .'ñÑ-]/g, '').slice(0, n);
let gotInit = null;
const initArrived = new Promise(r => { gotInit = r; });
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type !== 'leads-reveal-init') return;
  // only the portal (Apps Script serves it from *.googleusercontent.com) may say who this is, so nobody can frame
  // this page elsewhere and fake an acceptance
  if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
  who.id = clean(d.id, 12).toUpperCase(); who.nick = clean(d.nick, 24);
  who.stamp = d.stamp === 'ACCEPTED' ? 'ACCEPTED' : 'REVIEWED';   // only two words are ever drawn
  paintIdentity(); makeStamp();
  if (d.sound) trySound();
  gotInit();
});
const tell = (type, extra) => { if (embedded) try { parent.postMessage(Object.assign({ type }, extra || {}), '*'); } catch (e) { /* fine */ } };
const num = () => who.id ? who.id.replace('APP-', '') : '000';
function paintIdentity() {
  $('subject').textContent = 'SUBJECT ' + (who.id || '----');
  // brand book voice: short, second person, case-file words, the reveal saved for the last line, ending on an invitation
  $('endK').textContent = 'Subject ' + num() + ' // finding: ' + who.stamp.toLowerCase();
  $('endT').textContent = who.stamp === 'ACCEPTED' ? 'Welcome to LEADS' : 'Your file is ready';
  $('endS').textContent = who.stamp === 'ACCEPTED' ? 'Your file is ready. Come and see yourself.' : 'Come and see what we found.';
}

/* ============================== clock, sound, captions ============================== */
const pad = n => String(n).padStart(2, '0');
setInterval(() => { const d = new Date(); $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }, 500);
const S = makeSound();
const paintSound = () => { const on = S.on(); $('sound').innerHTML = SPEAKER(on) + (on ? ' Sound ON' : ' Sound OFF'); $('sound').setAttribute('aria-pressed', String(on)); $('sound').setAttribute('aria-label', on ? 'Sound on. Tap to mute' : 'Sound off. Tap to turn on'); };
paintSound();
$('sound').addEventListener('click', () => { S.toggle(); paintSound(); S.burst(.15, .5); });
// the portal's sound is on, so start with sound: the tap that opened the portal lets an embedded page play in most
// browsers; where it doesn't (Safari), the button simply stays at Sound OFF
function trySound() { S.set(true); paintSound(); setTimeout(() => { if (!S.running()) { S.set(false); paintSound(); } }, 500); }
const cap = captions($('cap'), $('capLive'), () => S.tick());

/* ============================== the stamp, drawn once (worn ink needs its own canvas) ============================== */
const stampC = document.createElement('canvas'); stampC.width = 1100; stampC.height = 300;
function makeStamp() {
  const s = stampC.getContext('2d'); s.clearRect(0, 0, 1100, 300);
  s.save(); s.strokeStyle = C.red; s.lineWidth = 18; s.strokeRect(20, 20, 1060, 260);
  s.fillStyle = C.red; s.textAlign = 'center'; s.textBaseline = 'middle'; s.font = '190px "Special Elite", "Courier New", monospace';
  s.fillText(who.stamp, 550, 162);
  s.globalCompositeOperation = 'destination-out';
  let seed = 5; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 900; i++) { s.globalAlpha = r() * .7; s.fillRect(r() * 1100, r() * 300, 3 + r() * 6, 2 + r() * 3); }
  s.restore();
}

/* ============================== the film ==============================
   0.0  red field, the LEADS eye shut; 0.3 it squashes open (party-video style)
   1.0  "I can see you."  the red iris looks around, blinks once
   3.5  "Do you see yourself?"  the iris turns into a mirror with your eye in it
   4.4  push into the mirror; 5.2 the scribble glitch
   6.2  the case file, typed in; 7.4 the stamp slams down; 7.9 "Finding: accepted."
   9.4  the Broadcast Card (stays until a tap) */
const END = 9.4;
const st = stage($('film'));
const { ctx } = st;
let t0 = 0, ended = false, playing = false, fired = {};
const once = (k, fn) => { if (!fired[k]) { fired[k] = true; fn(); } };

function frame(t) {
  const { W, H, u } = st, b = boil(t);
  st.begin(C.field);
  const cy = H * (W < H ? .4 : .42), ew = u * .4;
  const sh = shake(t, 7.55, u * .03);
  ctx.translate(sh.x, sh.y);

  if (t < 5.75) {   // the LEADS eye
    let open = t < .3 ? .02 : backOut((t - .3) / .55);
    open *= 1 - .92 * Math.sin(Math.PI * span(t, 2.3, 2.55));   // one slow blink
    const settle = span(t, 3.0, 3.4);
    const iris = { x: (Math.sin(t * 1.7) * .55 + Math.sin(t * 4.1) * .12) * (1 - settle), y: Math.cos(t * 1.3) * .3 * (1 - settle) };
    const push = reduced ? 0 : span(t, 4.4, 5.6);
    const w = ew * (1 + push * push * 3.2);
    wordEye(ctx, { cx: W / 2, cy: cy + (H / 2 - cy) * push, w, open, seed: b, iris, mirror: span(t, 3.5, 4.2), years: push < .05 });
  }
  const burst = reduced ? 0 : Math.sin(Math.PI * span(t, 5.2, 6.25));
  if (burst > 0) scribble(ctx, W / 2, H / 2, u * .55, burst, b);

  if (t >= 6.2) drawFile(t, b);

  ctx.setTransform(st.dpr, 0, 0, st.dpr, 0, 0);
  grain(st, .35, b);
  glitch(st, Math.max(burst, t < .25 ? .6 : 0, t >= 6.2 && t < 6.4 ? .7 : 0), b);
}

function drawFile(t, b) {
  const { W, H, u } = st;
  const fw = Math.min(W * .9, u * 1.05, H * .56 / .68), fh = fw * .68, x = (W - fw) / 2, y = H * (W < H ? .4 : .42) - fh / 2;   // leaves room for the caption
  const r = n => { let s = b * 31 + n; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
  const jit = r(3), J = () => (jit() - .5) * fw * .006;
  ctx.save();
  ctx.translate(x + fw / 2, y + fh / 2); ctx.rotate(-.02 + (reduced ? 0 : span(t, 6.2, 6.6) * .02 - .02)); ctx.translate(-x - fw / 2, -y - fh / 2);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x + 10, y + 12, fw, fh);
  ctx.fillStyle = C.manila; ctx.strokeStyle = C.ink; ctx.lineWidth = Math.max(2, fw * .006);
  ctx.beginPath(); ctx.moveTo(x + fw * .04 + J(), y - fh * .08 + J()); ctx.lineTo(x + fw * .34 + J(), y - fh * .08 + J()); ctx.lineTo(x + fw * .38 + J(), y + J()); ctx.lineTo(x + J(), y + J()); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + J(), y + J()); ctx.lineTo(x + fw + J(), y + J()); ctx.lineTo(x + fw + J(), y + fh + J()); ctx.lineTo(x + J(), y + fh + J()); ctx.closePath(); ctx.fill(); ctx.stroke();
  // the intake form
  const px = x + fw * .05, py = y + fh * .07, pw = fw * .9, ph = fh * .86;
  ctx.fillStyle = C.paper; ctx.fillRect(px, py, pw, ph);
  ctx.fillStyle = C.ink; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const fs = pw * .042;
  ctx.font = `700 ${Math.round(fs * .95)}px "JetBrains Mono", monospace`;
  ctx.fillText('INTAKE // CASE FILE 26/27', px + pw * .05, py + ph * .16);
  const typed = Math.floor(Math.max(0, t - 6.45) * (reduced ? 999 : 28));
  const rows = [['SUBJECT NO.', who.id || '----'], ['NAME', who.nick ? who.nick.toUpperCase() : '[REDACTED]'], ['OBSERVATION', 'COMPLETE'], ['FINDING', '']];
  let used = 0;
  rows.forEach(([k, v], i) => {
    const ry = py + ph * (.34 + i * .17);
    ctx.fillStyle = '#666'; ctx.font = `400 ${Math.round(fs * .8)}px "JetBrains Mono", monospace`; ctx.fillText(k, px + pw * .05, ry);
    ctx.fillStyle = C.ink; ctx.fillRect(px + pw * .36, ry + fs * .35, pw * .58, Math.max(1, fs * .06));
    ctx.font = `${Math.round(fs * 1.1)}px "Special Elite", "Courier New", monospace`;
    const n = Math.max(0, Math.min(v.length, typed - used)); used += v.length + 4;
    ctx.fillText(v.slice(0, n), px + pw * .37, ry);
  });
  // the photo corner holds the eye from Act 1: yours
  const fx = px + pw * .76, fy = py + ph * .05, fW = pw * .2, fH = ph * .19;
  ctx.strokeStyle = C.ink; ctx.lineWidth = Math.max(1.5, fw * .004); ctx.strokeRect(fx, fy, fW, fH);
  ctx.fillStyle = C.field; ctx.fillRect(fx + 3, fy + 3, fW - 6, fH - 6);
  partyEye(ctx, { cx: fx + fW / 2, cy: fy + fH / 2, w: fW * .34, look: { x: Math.sin(t * 2) * .3, y: 0 }, seed: b });
  if (t >= 7.3) {   // the stamp
    const p = reduced ? 1 : span(t, 7.3, 7.55), sc = 2.6 - 1.6 * p, sw = pw * .62 * sc, shh = sw * 300 / 1100;
    ctx.save(); ctx.globalAlpha = Math.min(1, p * 3); ctx.translate(px + pw * .6, py + ph * .76); ctx.rotate(-.1);
    ctx.drawImage(stampC, -sw / 2, -shh / 2, sw, shh); ctx.restore();
  }
  ctx.restore();
}

function caption(t) {
  if (t >= 1 && t < 3.4) cap.show('I can see you.', 1, t, 22);
  else if (t >= 3.5 && t < 5.2) cap.show('Do you see yourself?', 3.5, t, 22);
  else if (t >= 7.9 && t < END) cap.show('Finding: ' + who.stamp.toLowerCase() + '.', 7.9, t, 24);
  else cap.clear();
}
function sounds(t) {
  if (t >= .3) once('open', () => S.cue('open'));
  if (t >= 1) once('bell', () => S.cue('bell'));
  if (t >= 3.5) once('glass', () => S.cue('glass'));
  if (t >= 5.2) once('crackle', () => S.crackle(1.05));
  if (t >= 6.2) once('cut', () => S.burst(.3, .7));
  if (t >= 7.55) once('thud', () => S.thud());
  if (t >= 7.9) once('verdict', () => S.cue('verdict'));
  S.bedLevel(t < 5.2 ? .6 : .45, .025);
}

function loop() {
  if (!playing) return;
  const t = isNaN(FREEZE) ? (performance.now() - t0) / 1000 : FREEZE;
  frame(Math.min(t, END)); caption(t);
  if (isNaN(FREEZE)) sounds(t);
  if (t >= END) return finish();
  requestAnimationFrame(loop);
}
function start() {
  ended = false; fired = {}; cap.clear();
  $('end').classList.remove('on'); $('ctl').classList.remove('gone');
  t0 = performance.now(); playing = true; requestAnimationFrame(loop);
}
function finish() {
  if (ended) return; ended = true; playing = false;
  cap.clear(); frame(END); S.fade();
  $('ctl').classList.add('gone');   // the card has its own buttons
  $('end').classList.add('on'); $('open').focus();
}
addEventListener('resize', () => { st.fit(); if (ended || !isNaN(FREEZE)) frame(isNaN(FREEZE) ? END : FREEZE); });

/* Skip jumps to the card (the result is on it); closing only ever happens from the card */
$('skip').addEventListener('click', finish);
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!ended) finish(); else if (embedded) tell('leads-reveal-done', { closed: true }); });
$('open').addEventListener('click', () => {
  if (embedded) tell('leads-reveal-done', { open: true });
  else location.href = params.get('back') && /^https:\/\/script\.google\.com\//.test(params.get('back')) ? params.get('back') : PORTAL;
});
$('replay').addEventListener('click', () => { tell('leads-reveal-replay'); start(); });

/* ============================== go ============================== */
paintIdentity(); makeStamp();
await fontsReady();
makeStamp();   // again, now in the real typewriter font
tell('leads-reveal-ready');
// the portal answers ready with who this is; give it a moment so the file and the card never show the wrong name
if (embedded) await Promise.race([initArrived, new Promise(r => setTimeout(r, 800))]);
start();
</script>
</body>
</html>
