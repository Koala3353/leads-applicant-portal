<!-- Mascot.html  (shared: I.R.I.S., the pocket CRT television in the bottom-right corner.)
     I.R.I.S. = Inspection, Reconnaissance & Identification System. A small 90s TV with rabbit-ear antennas; the screen
     shows a real-looking eye that follows the pointer, and the set leans a little toward you. The screen carries its
     state: an on-screen REC/word overlay, static, colour bars, a rolling picture, and, when you hover it, your own
     silhouette (the brand book's mirror: the observer is you). It stands on its own, so it looks right wherever it is dragged.
     Every page adds it right after the Loader line, as a force-print scriptlet:
       includeOptional_('Mascot', { BRAND: BRAND, page: page })   (optional: if it breaks, the page still loads)
     Words, faces and LED colours live in Brand.gs (BRAND.mascot). Set BRAND.mascot.show = false to turn it off.
     Faces (kept for every page's existing calls): nervous, happy, excited, sad, scared, wink, love, thinking (+ off for
     Apply's power-on intro: the screen is dark, and switching it on plays a CRT warm-up). Each face sets the LED colour,
     the on-screen word, the eyelids, the antennas and the picture.
     Every ~7 seconds it idles: a body move (MOVES_IDLE) alternating with a screen effect (EFFECTS); never one of its last three.
     Errors: it turns red and says BRAND.mascot.error on 'hub:error', 'portal:error', or an unhandled error.
     Pages make it talk with window.Iris.say([face, text]) (window.Kuya is the same object).
     Never write a real scriptlet tag in a comment here: Apps Script runs scriptlets even inside comments. -->
