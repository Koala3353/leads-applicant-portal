<!doctype html>
<!--
  Eyes on LEADS: "The Site", PART 1 OF 2 (GitHub Pages; clasp ignores docs/). Plays once, full screen, right after an
  accepted applicant's FIRST proof-of-payment upload. Part 2 ("The Room") comes with room booking,
  which opens in January 2027; this one is the teaser.
  Steps.html opens it in a frame and says who it is:
      { type: 'leads-receipt-init', id: 'APP-2447', nick: 'Hanna', surname: 'Reyes', camp: '2027-01-29T00:00:00.000Z',
        amount: '4,000', time: '6:24 PM' }
  and, a moment later, their eye-scan photo { type: 'leads-reveal-eye', src: 'data:image/...' }. It answers
  'leads-receipt-ready', 'leads-receipt-alive' (keep-alive while the gate waits), 'leads-receipt-finished' /
  'leads-receipt-skip' and 'leads-receipt-done'. Only *-script.googleusercontent.com (the portal) may say who it is.

  LOOK (LEADS 2627 brand book): photocopied, not photographed. Every shot is a two-tone halftone print (plates/*.png,
  made from Unsplash-licence photos: Zoltan Tasi, Daniil Myakotin, Thomas Thompson, Samarth Kulkarni, Markus Spiske);
  over it, hand-inked marks that boil (red brush brackets, circles, strike-throughs, handwritten notes), the portal's
  retro OS window, REC / timestamps, scanlines on screen moments, the brand red dot, the blue broadcast card.
  SOUND: audio/site.mp3 (site_calm.mp3 for reduced motion), mixed from CC0 Freesound recordings; see audio/CREDITS.md.

  Story (seconds):  0 a call: someone breathes on the line; PAYMENT RECEIVED / SUBJECT CLEARED FOR TRANSFER; it hangs up.
   3.4 CAM 01 the road to Kasile Hills, empty, dogs far off.   5.4 CAM 02 someone standing in the fog.
   7.2 CAM 03 closer. The streetlight dies. NO SIGNAL.   8.9 CAM 04 the dorm corridor: the lights come on toward you;
   the door log replaces ROOM 207 UNASSIGNED with their surname; three knocks; DOOR 207 OPEN; every light dies.
   13.8 one second of silence and black.   15.0 ONE beat: their own eye, enormous, in negative.   15.6 the desk:
   a TRANSFER ORDER with their details, CLEARED is stamped, a red note: "We found your room."   18.6 the card.
  Brand rules (CONTEXT.md 7.1): scary, never gory; one scare, no strobing; the scare, shakes and flicker are skipped
  for reduced motion; the words end on an invitation (Part 2 in January, not a threat). No triangle eye.  ?at=15.05 freezes a frame (review, no sound).
-->
<html lang="en">

<body>

    <p class="k" id="endD" style="margin-top:12px" hidden></p>
    <div class="row"><button type="button" class="go" id="open">Back to my file</button><button type="button" id="replay">Replay</button></div>
  </div>
</div>

<script type="module">
import { reduced, rng, stamp, drawStamp, filmAudio, SPEAKER, fontsReady } from '../reveal/ink.js?v=3';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const embedded = window.parent !== window;
const FREEZE = parseFloat(params.get('at'));
const frozen = !isNaN(FREEZE);

/* ============================== who (from the portal) ============================== */
const who = { id: '', nick: '', surname: '', camp: null, amount: '', time: '' };
const clean = (v, n) => String(v || '').replace(/[^\w .,:'ñÑ-]/g, '').trim().slice(0, n);
const num = () => (who.id.replace(/^APP-/, '') || '----');
let eyeImg = null, gotInit = null;
const initArrived = new Promise(r => { gotInit = r; });
const trusted = e => (location.hostname === 'localhost' && e.origin === location.origin) || /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin);
window.addEventListener('message', e => {
  const d = e.data || {};
  if (!trusted(e)) return;
  if (d.type === 'leads-receipt-init') {
    who.id = clean(d.id, 12).toUpperCase(); who.nick = clean(d.nick, 18); who.surname = clean(d.surname, 24);
    who.amount = clean(d.amount, 12); who.time = clean(d.time, 10);
    const c = new Date(String(d.camp || '')); who.camp = isNaN(c) ? null : c;
    paintWho(); gotInit();
  } else if (d.type === 'leads-reveal-eye' && /^data:image\/(png|jpe?g|webp|gif);base64,/.test(String(d.src || ''))) {
    const img = new Image(); img.onload = () => { eyeImg = img; eyeArt = null; }; img.src = d.src;
  }
});
const tell = (type, extra) => { if (embedded) try { parent.postMessage(Object.assign({ type }, extra || {}), '*'); } catch (e) { /* fine */ } };
const doorName = () => (who.surname || who.nick || 'SUBJECT ' + num()).toUpperCase();
function paintWho() {
  if (who.nick) $('gateT').textContent = 'A transmission for ' + who.nick + '.';
  $('endK').textContent = 'EYES ON LEADS  ·  ' + (who.id ? 'SUBJECT ' + num() + '  ·  ' : '') + 'PART 1 OF 2';
  if (who.camp) {
    const days = Math.ceil((who.camp - Date.now()) / 864e5);
    if (days > 0) { $('endD').hidden = false; $('endD').textContent = days + (days === 1 ? ' DAY' : ' DAYS') + ' UNTIL KASILE HILLS'; }
  }
}

/* ============================== timeline ============================== */
const END = 21.5, CARD = 18.6, CARD_BTN = 19.0;
const CUT = { road: 3.4, fog: 5.4, green: 7.2, nosig: 8.6, hall: 8.9, dark: 13.75, scare: 15.0, desk: 15.6 };
const LIGHTS = [9.2, 9.55, 9.95, 10.4];       // the tubes come on, far to near
const TYPE_AT = 10.95, KNOCKS = [12.05, 12.62, 13.2], OPEN_AT = 13.2, DIE = 13.62, STAMP_AT = 16.9, NOTE = [17.3, 18.3];
const LIVE = [[0, 'A call. Someone is breathing on the line.'], [.8, 'Payment received. Subject cleared for transfer.'], [3.1, 'The line goes dead.'],
  [3.4, 'Camera 1: the road to Kasile Hills, at night. Empty.'], [5.4, 'Camera 2: someone is standing in the fog.'], [7.2, 'Camera 3: closer.'],
  [8.3, 'The streetlight dies. No signal.'], [8.9, 'Camera 4: a dormitory corridor. The lights come on, one by one, toward you.'],
  [10.95, 'The door log for room 207 changes from unassigned to your surname.'], [12.05, 'Three knocks.'], [13.2, 'Door 207 is open.'],
  [13.62, 'Every light goes out.'], [15.6, 'A transfer order on a desk, with your details. Stamped: cleared.'], [17.3, 'A note in red: we found your room.']];

/* ============================== stage ============================== */
const cv = $('film'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, V = { x: 0, y: 0, w: 0, h: 0 }, U = 1;   // V: the picture (2:3 on wide screens, full on phones)
function fit() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const vw = Math.min(W, H * 2 / 3); V = { x: (W - vw) / 2, y: 0, w: vw, h: H }; U = Math.min(V.w, V.h) / 400;
  makeLayer();
}
const PL = {}; ['road', 'fog', 'green', 'hall', 'desk'].forEach(k => { const i = new Image(); i.src = 'plates/' + k + '.png'; PL[k] = i; });
const ready = () => Object.values(PL).every(i => i.complete && i.naturalWidth);

// cover the picture with a plate, zoomed z toward plate point (fx, fy); returns the plate->screen mapping
function plateMap(img, z, fx, fy) {
  const s = Math.max(V.w / img.naturalWidth, V.h / img.naturalHeight) * z, w = img.naturalWidth * s, h = img.naturalHeight * s;
  let x = V.x + V.w / 2 - fx * s, y = V.y + V.h / 2 - fy * s;
  x = Math.min(V.x, Math.max(V.x + V.w - w, x)); y = Math.min(V.y, Math.max(V.y + V.h - h, y));
  return { s, x, y, w, h, P: (px, py) => [x + px * s, y + py * s] };
}
function plate(img, m, a = 1) { if (!img.naturalWidth) return; ctx.save(); ctx.globalAlpha = a; ctx.drawImage(img, m.x, m.y, m.w, m.h); ctx.restore(); }
const clipV = () => { ctx.beginPath(); ctx.rect(V.x, V.y, V.w, V.h); ctx.clip(); };
const span = (t, a, b) => { const x = Math.max(0, Math.min(1, (t - a) / (b - a))); return x * x * (3 - 2 * x); };
const pad = n => String(n).padStart(2, '0');
const boil = t => reduced ? 0 : Math.floor(t * 10);   // hand-drawn marks redraw 10x a second

/* ---------- hand-inked brush: several bristles, dry gaps, ink blobs at the ends (it boils) ---------- */
function brush(pts, w, seed, col, a = 1, frame = 0) {
  const r = rng(seed * 131 + frame * 7);
  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const J = w * .35;
  const P = pts.map(([x, y]) => [x + (r() - .5) * J, y + (r() - .5) * J]);
  for (let b = 0; b < 5; b++) {
    const off = (b - 2) * w * .16;
    ctx.globalAlpha = a * (.55 + r() * .45); ctx.lineWidth = w * (.28 + r() * .3);
    ctx.beginPath();
    for (let i = 0; i < P.length - 1; i++) {
      const [x0, y0] = P[i], [x1, y1] = P[i + 1], L = Math.hypot(x1 - x0, y1 - y0) || 1, nx = -(y1 - y0) / L, ny = (x1 - x0) / L;
      const steps = Math.max(2, Math.ceil(L / (w * 1.2)));
      for (let k = 0; k <= steps; k++) {
        const q = k / steps, x = x0 + (x1 - x0) * q + nx * (off + (r() - .5) * w * .12), y = y0 + (y1 - y0) * q + ny * (off + (r() - .5) * w * .12);
        if (r() < .06 && b !== 2) ctx.moveTo(x, y); else if (k === 0 && i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
  }
  ctx.globalAlpha = a * .9;
  [P[0], P[P.length - 1]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x + (r() - .5) * w * .3, y + (r() - .5) * w * .3, w * (.25 + r() * .2), 0, 7); ctx.fill(); });
  for (let i = 0; i < 4; i++) { const [x, y] = P[Math.floor(r() * P.length)]; ctx.globalAlpha = a * .7; ctx.beginPath(); ctx.arc(x + (r() - .5) * w * 3, y + (r() - .5) * w * 3, w * r() * .18, 0, 7); ctx.fill(); }   // spatter
  ctx.restore();
}
// [ ] corner brackets like the wordmark's, around a box
function brackets(x0, y0, x1, y1, w, seed, col, a, f) {
  const c = Math.min(x1 - x0, y1 - y0) * .28;
  brush([[x0, y0 + c], [x0, y0], [x0 + c, y0]], w, seed, col, a, f); brush([[x1 - c, y0], [x1, y0], [x1, y0 + c]], w, seed + 1, col, a, f);
  brush([[x0, y1 - c], [x0, y1], [x0 + c, y1]], w, seed + 2, col, a, f); brush([[x1 - c, y1], [x1, y1], [x1, y1 - c]], w, seed + 3, col, a, f);
}
function ring(cx, cy, rx, ry, w, seed, col, a, f, p = 1) {   // a hand-drawn circle, drawn on to fraction p
  const pts = [], n = 26, r = rng(seed);
  for (let i = 0; i <= n * p * 1.08; i++) { const q = i / n * Math.PI * 2 - 1.9; pts.push([cx + Math.cos(q) * rx * (1 + (r() - .5) * .08), cy + Math.sin(q) * ry * (1 + (r() - .5) * .1)]); }
  if (pts.length > 1) brush(pts, w, seed, col, a, f);
}
function hand(str, x, y, size, col, p = 1, rot = -.05) {   // handwriting, written on left to right
  ctx.save(); ctx.font = `${size}px "Reenie Beanie", cursive`; ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const w = ctx.measureText(str).width; ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.rect(-size, -size * 1.4, (w + size * 2) * p, size * 2.4); ctx.clip(); ctx.fillText(str, 0, 0); ctx.restore();
  return w;
}
function txt(str, x, y, font, col, a = 1, align = 'left') { ctx.save(); ctx.globalAlpha = a; ctx.font = font; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y); ctx.restore(); }

/* ---------- film surface: grain, scanlines, vignette, tracking, misregistration ---------- */
let grainTiles = [], scan = null, layer = null, lctx = null;
function makeTex() {
  const r = rng(11);
  grainTiles = [0, 1, 2, 3].map(() => {
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), d = g.createImageData(256, 256);
    for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = r() < .5 ? 40 : 0; }
    g.putImageData(d, 0, 0); return c;
  });
  const s = document.createElement('canvas'); s.width = 4; s.height = 3; const g = s.getContext('2d'); g.fillStyle = 'rgba(0,0,0,.32)'; g.fillRect(0, 0, 4, 1);
  scan = ctx.createPattern(s, 'repeat');
}
function makeLayer() { layer = document.createElement('canvas'); layer.width = cv.width; layer.height = cv.height; lctx = layer.getContext('2d'); lctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
function grain(f, a) { ctx.save(); clipV(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'overlay'; const g = grainTiles[f % 4]; const ox = (f * 97) % 256, oy = (f * 57) % 256;
  for (let x = V.x - ox; x < V.x + V.w; x += 256) for (let y = -oy; y < H; y += 256) ctx.drawImage(g, x, y); ctx.restore(); }
function screenFx(t, f, tint) {   // the CCTV monitor: tint, scanlines, vignette, a rolling tracking band
  ctx.save(); clipV();
  if (tint) { ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = tint; ctx.fillRect(V.x, V.y, V.w, V.h); ctx.globalCompositeOperation = 'source-over'; }
  ctx.fillStyle = scan; ctx.fillRect(V.x, V.y, V.w, V.h);
  if (!reduced) { const by = V.y + ((t * .22) % 1) * (V.h + 80) - 40; const g = ctx.createLinearGradient(0, by - 30, 0, by + 30);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.07)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(V.x, by - 30, V.w, 60); }
  ctx.restore(); vignette(.7);
}
function vignette(a) { ctx.save(); clipV(); const g = ctx.createRadialGradient(V.x + V.w / 2, H / 2, Math.min(V.w, V.h) * .3, V.x + V.w / 2, H / 2, Math.hypot(V.w, V.h) * .62);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); ctx.fillStyle = g; ctx.fillRect(V.x, V.y, V.w, V.h); ctx.restore(); }
function tear(t, at, f) {   // a tape tear at a cut: slices shove sideways for 3 frames
  if (reduced || t < at || t > at + .1) return;
  const r = rng(Math.floor(at * 100) + f);
  for (let i = 0; i < 7; i++) { const y = V.y + r() * V.h, h = 6 + r() * 40, dx = (r() - .5) * V.w * .25;
    ctx.drawImage(cv, V.x * DPR, y * DPR, V.w * DPR, h * DPR, V.x + dx, y, V.w, h); }
  ctx.save(); ctx.globalAlpha = .5; ctx.fillStyle = '#fff'; ctx.fillRect(V.x, V.y + r() * V.h, V.w, 2); ctx.restore();
}
function misreg(px) {   // red / blue print misregistration for screen moments
  if (reduced) return;
  ctx.save(); clipV(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .35;
  ctx.drawImage(cv, V.x * DPR, 0, V.w * DPR, H * DPR, V.x - px, 0, V.w, H); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(229,0,0,.12)'; ctx.fillRect(V.x, 0, V.w, H); ctx.restore();
}

/* ---------- the OSD (VT323), live clock from the moment they answered ---------- */
let wall = new Date();
const OSDB = () => 74 + Math.max(0, H * .01);   // the bottom OSD sits above the Sound / Skip buttons
function osd(t, cam, place, extra) {
  const m = 14 * U / 1.6 + 6, fs = Math.round(Math.max(15, U * 13)), F = `${fs}px VT323, monospace`, x0 = V.x + m, x1 = V.x + V.w - m;
  const now = new Date(wall.getTime() + Math.max(0, t) * 1000);
  const date = now.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }).toUpperCase().replace(',', '');
  if (reduced || (t % 1) < .55) { ctx.fillStyle = '#e50000'; ctx.beginPath(); ctx.arc(x0 + fs * .3, m + fs * .55, fs * .28, 0, 7); ctx.fill(); }
  txt('REC  ' + cam, x0 + fs * .8, m + fs * .85, F, '#e9e6dc', .92);
  txt(date + '  ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds()), x1, m + fs * .85, F, '#e9e6dc', .92, 'right');
  const yb = H - OSDB();
  txt(place, x0, yb - fs * (extra ? 1.3 : 0), F, '#e9e6dc', .85);
  if (extra) txt(extra[0], x0, yb, F, extra[1] || '#e9e6dc', .95);
}

/* ---------- scene 0: the call ---------- */
function callShot(t, f) {
  ctx.fillStyle = '#050505'; ctx.fillRect(V.x, V.y, V.w, V.h);

  else if (t < CUT.nosig) figShot(t, f, 'green', 'CAM 03', '0.97', 1.04, 1.16);
  else if (t < CUT.hall) noSignal(t, f);
  else if (t < CUT.dark) hallShot(t, f);

}
$('skip').addEventListener('click', skip);
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if ($('end').inert) skip(); else tell('leads-receipt-done'); });
$('open').addEventListener('click', () => tell('leads-receipt-done'));
$('replay').addEventListener('click', () => { tell('leads-receipt-alive'); start(); });
addEventListener('resize', () => { fit(); if (!playing) frame(frozen ? FREEZE : 0); });

/* ============================== go ============================== */
fit(); makeTex(); paintSound();
A.load();
await fontsReady();
try { await Promise.race([Promise.all(['24px VT323', '30px "Reenie Beanie"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2000))]); } catch (e) { /* fine */ }
cleared = stamp('CLEARED', '#e50000');
await Promise.race([Promise.all(Object.values(PL).map(i => i.decode ? i.decode().catch(() => {}) : null)), new Promise(r => setTimeout(r, 4000))]);
tell('leads-receipt-ready');
if (embedded) await Promise.race([initArrived, new Promise(r => setTimeout(r, 800))]);
paintWho();
if (frozen) start();
else {
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H); $('gate').hidden = false; $('gateGo').focus();
  const alive = setInterval(() => tell('leads-receipt-alive'), 30000);
  $('gateGo').addEventListener('click', () => {
    clearInterval(alive); $('gate').hidden = true;
    A.set(true); paintSound();   // inside the tap: phones allow sound now
    tell('leads-receipt-alive'); start();
  }, { once: true });
}
</script>
